<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* The Dynamic Island. Technique after Bloom (github.com/sehajveersingh2005/bloom): the window keeps
     one size per edge and never resizes while the island animates. The island is a single element
     anchored to its screen edge; its width, height and corner radii spring between shapes (closed
     pill → Live Activity / alert → slim ring strip → panel), and the transparent rest of the window
     lets clicks through (Rust polls the cursor against the rectangles this page reports). The concave
     fillets where the island meets the screen are its children, so they ride along with it. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}

  #root{
    position:relative;width:100%;height:100%;color:var(--text);--along:.5;
    --ink:#000;--ink2:#141417;--ink3:#1f1f24;--line:#2a2a30;--text:#f2f2f5;--mute:#8d8d96;--accent:#0A84FF;
    --ew:cubic-bezier(.34,1.4,.64,1);--eh:cubic-bezier(.34,1.4,.64,1);--er:cubic-bezier(.22,1,.36,1);
    --dw:520ms;--dh:560ms;--dr:360ms;--soft:cubic-bezier(.22,1,.36,1);
  }
  /* ---------- Themes: surfaces and the accent; quota colours stay semantic ---------- */
  #root[data-theme="graphite"]{--ink:#1b1b1e;--ink2:#26262a;--ink3:#303035;--line:#3a3a40;--accent:#c7c7d1}
  #root[data-theme="ocean"]{--ink:#03131f;--ink2:#0a2233;--ink3:#0f2e44;--line:#163c56;--mute:#86a3b5;--accent:#22d3ee}
  #root[data-theme="sunset"]{--ink:#170a0b;--ink2:#27130f;--ink3:#351b15;--line:#46261c;--mute:#b39488;--accent:#fb923c}
  #root[data-theme="forest"]{--ink:#06130c;--ink2:#0d2317;--ink3:#133120;--line:#1a3f2a;--mute:#8fae9c;--accent:#34d399}
  #root[data-theme="rose"]{--ink:#16080f;--ink2:#27111c;--ink3:#351726;--line:#461f33;--mute:#b391a4;--accent:#f472b6}
  #root[data-theme="glass"]{--ink:rgba(16,16,20,.78);--ink2:rgba(255,255,255,.06);--ink3:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--accent:#ffffff}

  /* ---------- The island ---------- */
  #island{position:absolute;background:var(--ink);width:200px;height:32px;
    transition:width var(--dw) var(--ew),height var(--dh) var(--eh),border-radius var(--dr) var(--er),opacity .2s}
  #root[data-edge="top"] #island{top:0;left:calc(var(--along) * 100%);transform:translateX(-50%)}
  #root[data-edge="bottom"] #island{bottom:0;left:calc(var(--along) * 100%);transform:translateX(-50%)}
  #root[data-edge="right"] #island{right:0;top:calc(var(--along) * 100%);transform:translateY(-50%)}
  #root[data-edge="left"] #island{left:0;top:calc(var(--along) * 100%);transform:translateY(-50%)}
  #root[data-edge="free"] #island{top:0;left:calc(var(--along) * 100%);transform:translateX(-50%)}
  .clip{position:absolute;inset:0;overflow:hidden;border-radius:inherit}

  /* Fillets: the concave curve between island and screen edge — a 12 px square of ink with a circle
     punched out of its outer corner, on each side of the island */
  .fil{position:absolute;width:12px;height:12px;pointer-events:none}
  #root[data-edge="free"] .fil{display:none}
  #root[data-edge="top"] .fil-a{top:0;left:-12px;background:radial-gradient(circle at 0 100%,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="top"] .fil-b{top:0;right:-12px;background:radial-gradient(circle at 100% 100%,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="bottom"] .fil-a{bottom:0;left:-12px;background:radial-gradient(circle at 0 0,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="bottom"] .fil-b{bottom:0;right:-12px;background:radial-gradient(circle at 100% 0,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="right"] .fil-a{right:0;top:-12px;background:radial-gradient(circle at 0 0,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="right"] .fil-b{right:0;bottom:-12px;background:radial-gradient(circle at 0 100%,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="left"] .fil-a{left:0;top:-12px;background:radial-gradient(circle at 100% 0,transparent 11.5px,var(--ink) 12.5px)}
  #root[data-edge="left"] .fil-b{left:0;bottom:-12px;background:radial-gradient(circle at 100% 100%,transparent 11.5px,var(--ink) 12.5px)}

  /* Layers: each keeps the size of its own state and is anchored like the island, so the island
     growing or shrinking reveals it rather than squashing it */
  .layer{position:absolute;opacity:0;pointer-events:none;transition:opacity .16s var(--soft)}
  .layer.on{opacity:1;pointer-events:auto;transition:opacity .26s var(--soft) .07s}
  #root:is([data-edge="top"],[data-edge="free"]) .layer{top:0;left:50%;transform:translateX(-50%)}
  #root[data-edge="bottom"] .layer{bottom:0;left:50%;transform:translateX(-50%)}
  #root[data-edge="right"] .layer{right:0;top:50%;transform:translateY(-50%)}
  #root[data-edge="left"] .layer{left:0;top:50%;transform:translateY(-50%)}

  /* closed pill */
  #lClosed{display:flex;align-items:center;gap:7px;padding:0 12px 0 5px;cursor:pointer}
  #root:is([data-edge="left"],[data-edge="right"]) #lClosed{flex-direction:column;justify-content:center;gap:6px;padding:8px 0}
  .c-ring{position:relative;width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
  .c-ring svg{position:absolute;inset:0;width:100%;height:100%}
  .c-ring img{width:12px!important;height:12px!important;border-radius:3px}
  .c-ring .mark{display:flex;width:12px;height:12px} .c-ring .mark svg{position:static;width:12px;height:12px;fill:currentColor}
  .c-pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .c-gap{flex:1}
  .c-reset{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.85;margin:auto}
  #root:is([data-edge="left"],[data-edge="right"]) .c-pct{font-size:10px}
  #root:is([data-edge="left"],[data-edge="right"]) .c-reset{font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .c-work{width:6px;height:6px;border-radius:50%;background:#28E07B;box-shadow:0 0 6px #28E07B;animation:pulse 1.1s steps(6) infinite;flex:0 0 auto}

  /* peek: Live Activity / alert */
  #lLive{display:flex;align-items:center;gap:9px;padding:0 14px 0 8px;cursor:pointer}
  .lv-ic{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:12px;font-weight:700}
  #root[data-peek="2"] .lv-ic{width:38px;height:38px}
  .lv-ic img{width:16px!important;height:16px!important;border-radius:4px}
  .lv-ic .mark{display:flex;width:16px;height:16px} .lv-ic .mark svg{width:16px;height:16px;fill:currentColor}
  .lv-ic svg.lv-ring{position:absolute;inset:0;width:100%;height:100%}
  .lv-txt{min-width:0;flex:1;line-height:1.25}
  .lv-t{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #root[data-peek="2"] .lv-t{font-size:13.5px}
  .lv-s{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* open: the slim strip of provider rings */
  #lStrip{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
  #root:is([data-edge="left"],[data-edge="right"]) #lStrip{flex-direction:column}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:14px;padding:4px 2px;width:58px;
    opacity:0;transform:scale(.6);transition:opacity .2s,transform .5s var(--ew),background .15s}
  .layer.on .cell{opacity:1;transform:none;transition-delay:calc(60ms + var(--i,0) * 35ms)}
  .cell:hover,.cell.hot{background:var(--ink2)}
  .ringwrap{position:relative;width:46px;height:46px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible}
  .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:-.5px}
  .glyph.small{font-size:12px}
  .glyph img,.glyph svg{display:block;pointer-events:none}
  .glyph .mark{display:block;width:20px;height:20px} .glyph .mark svg{width:20px;height:20px;fill:currentColor}
  .glyph img.png{width:20px;height:20px;object-fit:contain}
  .glyph img.appicon{width:24px;height:24px;border-radius:7px;object-fit:cover}
  .pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .more{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:0;background:var(--ink2);color:var(--mute);font-size:16px;line-height:1;cursor:pointer;
    opacity:0;transform:scale(.6);transition:opacity .2s,transform .5s var(--ew),background .15s,color .15s}
  .layer.on .more{opacity:1;transform:none;transition-delay:calc(60ms + var(--i,0) * 35ms)}
  .more:hover{background:var(--ink3);color:var(--text)}
  .dim{opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* steps(): a 60 fps SVG animation in a transparent topmost window slows the whole desktop compositor */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center;transform-box:fill-box}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}

  /* the detail card beside the strip */
  #card{position:absolute;width:262px;max-height:calc(100% - 16px);overflow-y:auto;overflow-x:hidden;background:var(--ink);border-radius:18px;padding:14px;
    box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:scale(.94);
    transition:opacity .16s var(--soft),transform .45s var(--ew);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  #card.show{opacity:1;pointer-events:auto;transform:none}

  /* panel */
  #lPanel{display:flex;flex-direction:column;padding:10px 14px 14px}
  #root[data-edge="bottom"] #lPanel{padding:14px 14px 10px}
  .ptop{display:flex;align-items:center;gap:8px;flex:0 0 auto;cursor:grab}
  .back{width:30px;height:30px;border-radius:50%;border:0;background:var(--ink2);color:var(--mute);font-size:15px;cursor:pointer;flex:0 0 auto}
  .back:hover{background:var(--ink3);color:var(--text)}
  #tabs{position:relative;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--ink2);margin:0 auto}
  #tabs button{position:relative;z-index:1;font-family:inherit;font-size:12px;font-weight:600;line-height:1;color:var(--mute);background:transparent;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;transition:color .2s}
  #tabs button.on{color:var(--text)}
  #tabs button[hidden]{display:none}
  #tabInk{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--ink3);transition:transform .5s var(--ew),width .5s var(--ew)}
  #pagesWrap{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:10px}
  #pages{display:flex;height:100%;transition:transform .55s var(--ew)}
  .page{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;padding:2px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .page.enter > *{animation:rise .45s var(--ew) both}
  .page.enter > *:nth-child(2){animation-delay:.03s} .page.enter > *:nth-child(3){animation-delay:.06s} .page.enter > *:nth-child(4){animation-delay:.09s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .sum{font-size:11.5px;color:var(--mute);margin:0 2px 10px;display:flex;gap:10px;flex-wrap:wrap}
  .sum b{font-weight:650}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .tile{background:var(--ink2);border:1px solid transparent;border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .35s var(--ew),border-color .2s,background .2s}
  .tile:hover{transform:translateY(-2px);border-color:var(--line);background:var(--ink3)}
  .tile .ringwrap{width:52px;height:52px}
  .t-name{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .t-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .t-sub{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:13px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--mute);background:var(--ink2);border:1px solid transparent;border-radius:99px;padding:5px 10px 5px 6px;cursor:pointer;transition:all .2s}
  .chip.on{color:var(--text);border-color:var(--accent);background:var(--ink3)}
  .chip img{width:14px!important;height:14px!important;border-radius:3px}
  .chip .mark{display:flex;width:14px;height:14px} .chip .mark svg{width:14px;height:14px;fill:currentColor}
  .chip .cdot{width:8px;height:8px;border-radius:50%}
  .d-card{background:var(--ink2);border-radius:16px;padding:14px}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .c-head img{width:16px!important;height:16px!important;border-radius:4px}
  .c-head .mark{display:inline-flex;width:16px;height:16px} .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--mute);margin-bottom:6px}
  .win{margin-top:12px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{font-weight:600;white-space:nowrap}
  .w-reset{color:var(--mute);font-size:11px;white-space:nowrap;margin-left:auto}
  .w-track{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:3px;transition:width .6s var(--ew)}
  .w-used{font-size:11px;color:var(--mute)}
  .w-fc{font-size:11px;margin-top:3px}
  .spark{display:block;width:100%;height:24px;margin-top:5px}
  .spark-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mute);opacity:.6;margin-top:1px}
  .c-note{font-size:12px;color:var(--mute);line-height:1.5;margin-top:8px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);padding:3px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-jump{cursor:pointer;border-radius:8px;margin:0 -6px;padding:4px 6px;transition:background .15s}
  .s-jump:hover{background:var(--ink3);color:var(--text)}
  .s-title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-go{font-size:11px;opacity:0;transition:opacity .15s} .s-jump:hover .s-go{opacity:.7}
  .btn{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text);background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;transition:transform .3s var(--ew),background .15s}
  .btn:hover{background:var(--line)} .btn:active{transform:scale(.95)}
  .btn.acc{background:var(--accent);color:#08080a;border-color:transparent}
  .q-group{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .q-group:first-child{margin-top:4px;border-top:none;padding-top:0}
  .q-head{display:flex;align-items:center;gap:6px;min-width:0}
  .q-head .mark{display:inline-flex;width:14px;height:14px;flex:0 0 auto} .q-head .mark svg{width:14px;height:14px;fill:currentColor}
  .q-head img{width:14px!important;height:14px!important;border-radius:3px;flex:0 0 auto}
  .q-title{font-size:12.5px;font-weight:700;white-space:nowrap}
  .q-plan{font-size:10px;color:var(--mute);background:var(--ink3);border-radius:99px;padding:1px 6px;white-space:nowrap}
  .q-acct{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;min-width:0}
  .q-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;align-items:baseline;margin-top:7px;font-size:11px}
  .q-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-pct{font-weight:600;font-variant-numeric:tabular-nums}
  .q-reset{color:var(--mute);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .q-bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
  .q-bar i{display:block;height:100%;border-radius:2px}
  .q-msg{font-size:11px;color:#c8a24a;margin-top:6px;line-height:1.4}
  .q-tip{font-size:11px;line-height:1.4;color:#bfeed3;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.18);border-radius:10px;padding:7px 9px;margin:4px 0 8px}
  .sec{background:var(--ink2);border-radius:16px;padding:12px 14px;margin-bottom:8px}
  .sec h4{margin:0 0 8px;font-size:11px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:10px;min-height:32px}
  .row + .row{border-top:1px solid var(--line)}
  .row .rl{flex:1;min-width:0;font-size:12.5px}
  .row .rs{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw{position:relative;width:38px;height:22px;flex:0 0 auto;border-radius:99px;background:var(--ink3);border:0;cursor:pointer;transition:background .25s}
  .sw::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#f2f2f5;transition:transform .45s var(--ew)}
  .sw.on{background:var(--accent)} .sw.on::before{transform:translateX(16px);background:#fff}
  #root:is([data-theme="glass"],[data-theme="graphite"]) .sw.on::before{background:#111}
  .sw:disabled{opacity:.5;cursor:default}
  .seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--ink3);flex-wrap:wrap}
  .seg button{flex:1;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--mute);background:transparent;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;transition:all .25s var(--soft);white-space:nowrap}
  .seg button.on{background:var(--accent);color:#08080a}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .35s var(--ew)}
  .swatch:hover{transform:scale(1.1)} .swatch.on{border-color:var(--text)}
  .swatch i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2)}
  .pchips{display:flex;gap:6px;flex-wrap:wrap}
  .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .foot .by{margin-left:auto;font-size:10.5px;color:var(--mute)}
  .conn-g{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:10px 2px 4px}

  /* Dragging: the island travels as a plain pill in the middle of the window, which keeps its size
     and moves with the cursor centred on it (resizing it mid-gesture flashed blank frames) */
  #dragpill{position:absolute;left:50%;top:50%;width:150px;height:40px;margin:-20px 0 0 -75px;border-radius:20px;background:var(--ink);
    box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:7px;padding:0 12px 0 6px;
    opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .15s,transform .5s var(--ew)}
  #root[data-drag="1"] #dragpill{opacity:1;transform:scale(1.04)}
  #root[data-drag="1"] :is(#island,#card){opacity:0!important;pointer-events:none!important}
  /* landing: everything hidden at once while the window takes its docked place, then the island fades in */
  #root[data-drag="2"] :is(#island,#card,#dragpill){opacity:0!important;transition:none!important;pointer-events:none!important}

  #notice{position:absolute;left:12px;right:12px;bottom:8px;font-size:10.5px;color:var(--mute);background:var(--ink2);border-radius:8px;padding:5px 8px;display:none}
  #notice.show{display:block}
</style>
</head>
<body>
<div id="root" data-edge="right" data-state="idle" data-peek="0" data-theme="midnight">
  <div id="island">
    <div class="fil fil-a"></div><div class="fil fil-b"></div>
    <div class="clip">
      <div class="layer on" id="lClosed"></div>
      <div class="layer" id="lLive"></div>
      <div class="layer" id="lStrip"></div>
      <div class="layer" id="lPanel">
        <div class="ptop">
          <button class="back" data-act="back" title="Back">‹</button>
          <div id="tabs">
            <div id="tabInk"></div>
            <button data-tab="usage" class="on">Usage</button>
            <button data-tab="detail">Details</button>
            <button data-tab="r9" hidden>9Router</button>
            <button data-tab="settings">Settings</button>
          </div>
          <span style="width:30px"></span>
        </div>
        <div id="pagesWrap"><div id="pages">
          <section class="page" data-page="usage"></section>
          <section class="page" data-page="detail"></section>
          <section class="page" data-page="r9"></section>
          <section class="page" data-page="settings"></section>
        </div></div>
      </div>
    </div>
  </div>
  <div id="card"></div>
  <div id="dragpill"></div>
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const AMBER='#FFBF00', RUNGREEN='#28E07B';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
let ccSnap={status:'absent',windows:[],fetched_at:0,note:''};
let r9Snap={status:'absent',windows:[],fetched_at:0,note:''};
let dsSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cfg={opacity:1,scale:1,edge:'right',drag_enabled:false,live_activity:true,alert_levels:[80,95],theme:'midnight',hide_fullscreen:true,hidden_providers:[]};
let glyphs={}, activity=[], stateSnap={sessions:[],agg:'idle'};

const $=id=>document.getElementById(id);
const root=$('root'), island=$('island'), cardEl=$('card'), pagesEl=$('pages');
const L={closed:$('lClosed'), live:$('lLive'), strip:$('lStrip'), panel:$('lPanel')};

/* Window size per edge, mirrored from main.rs (WIN_WIDE / WIN_TALL), plus the drag pill (DRAG_*):
   the "design width" the size-setting zoom is measured against */
const WIN={wide:[620,520],tall:[480,640]};
const THEMES=[['midnight','Midnight','#000000','#0A84FF'],['graphite','Graphite','#1b1b1e','#c7c7d1'],['ocean','Ocean','#03131f','#22d3ee'],
  ['sunset','Sunset','#170a0b','#fb923c'],['forest','Forest','#06130c','#34d399'],['rose','Rose','#16080f','#f472b6'],['glass','Glass','#2a2a30','#ffffff']];

// Declared up here: designWidth() reads them during the first reportDpr()
let state='idle', peek=0, press=null, dragging=false, edge='right';
const side=()=> edge==='left'||edge==='right';

/* ---------- Springs ----------
   Each property gets its own spring (the values Bloom tunes its island with: width 400/31,
   height 450/29, corners stiffer), simulated once and sampled into CSS linear(), so the three move
   as one liquid shape with a small overshoot — and the compositor runs it, no animation frames needed. */
function spring(k,c){
  let x=0,v=0,t=0; const dt=1/120, pts=[0];
  while(t<2){ const a=-k*(x-1)-c*v; v+=a*dt; x+=v*dt; t+=dt; pts.push(x); if(t>.15&&Math.abs(x-1)<.001&&Math.abs(v)<.01) break; }
  const step=Math.max(1,Math.floor(pts.length/64)), s=[];
  for(let i=0;i<pts.length;i+=step) s.push(+pts[i].toFixed(4));
  s.push(1);
  return {css:`linear(${s.join(',')})`, ms:Math.round(t*1000)};
}
if(CSS.supports('transition-timing-function','linear(0, 1)')){
  const w=spring(400,31), h=spring(450,29), r=spring(1000,40), soft=spring(500,45);
  for(const [k,v] of [['--ew',w.css],['--eh',h.css],['--er',r.css],['--soft',soft.css],['--dw',w.ms+'ms'],['--dh',h.ms+'ms'],['--dr',r.ms+'ms']]) root.style.setProperty(k,v);
}

/* ---------- Island geometry ----------
   Every state is a width, a height and a corner radius; the flush edge keeps square corners. */
function stripSize(){
  const n=providers().length+1; // + the "more" button
  const cell=side()?64:62, gap=8;
  return side() ? [78, Math.min(n*cell+(n-1)*gap+24, WIN.tall[1]-40)] : [Math.min(n*cell+(n-1)*gap+24, WIN.wide[0]-40), 90];
}
function geom(){
  if(state==='panel') return side()?[400,540,28]:[540,440,28];
  if(state==='open'){ const [w,h]=stripSize(); return [w,h,26]; }
  if(peek===2) return side()?[360,64,30]:[380,60,28];
  if(peek===1) return side()?[300,52,26]:[300,42,21];
  if(edge==='free') return [200,38,19];
  return side()?[32,140,16]:[200,32,16];
}
function radius(r){
  switch(edge){
    case 'top': return `0 0 ${r}px ${r}px`;
    case 'bottom': return `${r}px ${r}px 0 0`;
    case 'right': return `${r}px 0 0 ${r}px`;
    case 'left': return `0 ${r}px ${r}px 0`;
    default: return `${r}px`;
  }
}
const layerSize={
  closed:()=>edge==='free'?[200,38]:(side()?[32,140]:[200,32]),
  live:()=>side()?(peek===2?[360,64]:[300,52]):(peek===2?[380,60]:[300,42]),
  strip:()=>stripSize(),
  panel:()=>side()?[400,540]:[540,440],
};
function applyShape(){
  const [w,h,r]=geom();
  island.style.width=w+'px'; island.style.height=h+'px'; island.style.borderRadius=radius(r);
  const active = state==='panel'?'panel' : state==='open'?'strip' : peek?'live':'closed';
  for(const [k,el] of Object.entries(L)){
    const [lw,lh]=layerSize[k]();
    el.style.width=lw+'px'; el.style.height=lh+'px';
    el.classList.toggle('on',k===active);
  }
  root.dataset.state=state; root.dataset.peek=String(peek);
  burstRects();
}

/* ---------- Open / close ---------- */
function openStrip(){
  clearTimeout(closeT); clearTimeout(dwellT);
  if(state!=='idle') return;
  state='open'; renderStrip(); applyShape();
  invoke('notch_expand',{on:true}).catch(()=>{});
}
function openPanel(tab){
  clearTimeout(closeT);
  hideCard(true);
  if(tab) curTab=tab;
  state='panel'; applyShape(); setTab(curTab,true);
  invoke('notch_expand',{on:true}).catch(()=>{});
}
function closeAll(){
  clearTimeout(dwellT);
  if(state==='idle') return;
  hideCard(true);
  state='idle'; applyShape();
  invoke('notch_expand',{on:false}).catch(()=>{});
  setTimeout(pumpToasts,500);
}

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // Claude Desktop's network traffic only counts when the hooks see no session at all
    if(!(stateSnap.sessions||[]).length && activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph;
}
function allProviders(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(ccSnap.status!=='absent') list.push({id:'commandcode',name:'Command Code',glyph:'Cc',snap:ccSnap});
  if(r9Snap.status!=='absent') list.push({id:'router9',name:'9Router',glyph:'9r',snap:r9Snap});
  if(dsSnap.status!=='absent') list.push({id:'deepseek',name:'DeepSeek',glyph:'Ds',snap:dsSnap});
  return list;
}
function providers(){
  const list=allProviders();
  const hid=cfg.hidden_providers||[], ord=cfg.provider_order||[];
  const rank=id=>{ const i=ord.indexOf(id); return i<0 ? 100+list.findIndex(p=>p.id===id) : i; };
  const shown=list.filter(p=>!hid.includes(p.id)).sort((a,b)=>rank(a.id)-rank(b.id));
  return shown.length ? shown : list.slice(0,1);
}
function headlineOf(snap){
  if(!snap.windows.length) return null;
  const metered=snap.windows.filter(w=>w.count==null);
  if(metered.length) return metered.reduce((a,b)=> b.used>a.used?b:a);
  return snap.windows[0];
}
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>5*60*1000; }
function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 28 28)" ${extra}/>`;
}
function ringSvg(p){
  const h=headlineOf(p.snap);
  let inner=`<circle cx="28" cy="28" r="22" fill="var(--ink2)"/><circle cx="28" cy="28" r="25" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>`;
  if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
  const ws=workState(p.id);
  if(ws==='running') inner+=`<g class="arc-spin">${svgArc(19,0.28,RUNGREEN,2.5)}</g>`;
  else if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/></g>`;
  return `<svg class="ring" viewBox="0 0 56 56">${inner}</svg>`;
}
function ring22(u,color){
  const C=2*Math.PI*9.5;
  return `<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.5"/>`
    +(u==null?'':`<circle cx="11" cy="11" r="9.5" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(C*Math.min(u,1)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 11 11)"/>`)+`</svg>`;
}

/* ---------- DeepSeek pricing ---------- (api-docs.deepseek.com/quick_start/pricing) */
const DS_PEAK=[[60,240],[360,600]];
function dsPeakAt(t){ const d=new Date(t), w=d.getUTCDay(); if(w<1||w>5) return false; const m=d.getUTCHours()*60+d.getUTCMinutes(); return DS_PEAK.some(([a,b])=>m>=a&&m<b); }
function dsPricing(t=Date.now()){
  const peak=dsPeakAt(t), d=new Date(t);
  const day0=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  for(let i=0;i<9;i++) for(const [a,b] of DS_PEAK) for(const m of [a,b]){ const c=day0+i*864e5+m*6e4; if(c>t && dsPeakAt(c)!==peak) return {peak,next:c}; }
  return {peak,next:null};
}
function hm(ms){ return new Date(ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }
function dsHoursLocal(){ const at=m=>hm(Date.UTC(2024,0,1,0,m)); return `${at(60)}–${at(240)} & ${at(360)}–${at(600)}`; }
function whenCopy(ms){ if(!ms) return ''; const d=new Date(ms), same=d.toDateString()===new Date().toDateString(); return (same?'':d.toLocaleDateString('en-US',{weekday:'short'})+' ')+hm(ms)+' ('+soonCopy(ms)+')'; }
function shortMoney(s){ const m=/^([$¥])([\d.]+)/.exec(s||''); if(!m) return null; const n=parseFloat(m[2]); return m[1]+(n>=100?Math.round(n):n.toFixed(1)); }
function renderDeepseek(snap){
  let h='';
  for(const w of snap.windows){
    const left=Math.max(0,Math.round((1-w.used)*100)), parts=(w.amount||'').split(' · ');
    h+=`<div class="win"><div class="w-row"><span class="w-label">${esc(w.label)}</span><span class="w-reset">${esc(parts[0]||'')}</span></div>
      <div class="w-track"><div class="w-fill" style="width:${left}%;background:${tone(w.used)}"></div></div>
      <div class="w-used">~${left}% of the last top-up left${parts.length>1?' · '+esc(parts.slice(1).join(' · ')):''}</div></div>`;
  }
  const {peak,next}=dsPricing(), col=peak?'#FF8A3D':AMPLE;
  h+=`<div class="win"><div class="w-row"><span class="w-label"><span class="s-dot" style="display:inline-block;background:${col};margin-right:6px"></span>${peak?'Peak pricing':'Off-peak · 50% cheaper'}</span></div>
    <div class="w-used">${peak?'Off-peak':'Peak'} starts ${esc(whenCopy(next))}</div><div class="w-used">Peak hours: ${dsHoursLocal()}, weekdays</div></div>`;
  if(snap.note && !shortMoney(snap.note)) h+=`<div class="c-note">${esc(snap.note)}</div>`;
  return h;
}

/* ---------- Live Activity + alerts ---------- */
let toastQ=[], toastNow=null, toastT=null;
function liveInfo(){
  if(cfg.live_activity===false) return null;
  const ps=providers();
  const att=ps.find(p=>workState(p.id)==='attention');
  const run=ps.filter(p=>workState(p.id)==='running');
  const p=att||run[0]; if(!p) return null;
  const h=headlineOf(p.snap), metered=h&&h.count==null;
  const title=att?`${p.name} needs you`:`${p.name} working`;
  const what=workDetail(p.id);
  const sub=att ? (what||'Waiting for your reply') : [what, run.length>1?`+${run.length-1} more`:''].filter(Boolean).join(' · ') || (metered&&h.resets_at?resetCopy(h.resets_at):'');
  const ring=att
    ?`<svg class="lv-ring arc-pulse" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="none" stroke="${AMBER}" stroke-width="2"/></svg>`
    :`<svg class="lv-ring arc-spin" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="none" stroke="${RUNGREEN}" stroke-width="2" stroke-dasharray="20 79" stroke-linecap="round"/></svg>`;
  return `<span class="lv-ic">${ring}${glyphHtml(p,true)||esc(p.glyph)}</span><div class="lv-txt"><div class="lv-t">${esc(title)}</div>${sub?`<div class="lv-s">${esc(sub)}</div>`:''}</div>`
    +(metered?`<span class="lv-v" style="color:${tone(h.used)}">${Math.round(h.used*100)}%</span>`:'');
}
function workDetail(id){
  if(id==='claude'){
    const ss=stateSnap.sessions||[];
    const s=ss.find(s=>s.state==='attention')||ss.find(s=>s.state==='running');
    if(s) return s.title;
    return activity.some(a=>a.provider==='claude'&&a.state==='busy') ? 'Claude Desktop · streaming' : '';
  }
  const a=activity.find(a=>a.provider===id&&a.state==='waiting')||activity.find(a=>a.provider===id&&a.state==='busy');
  return a ? [a.name,a.detail].filter(Boolean).join(' · ') : '';
}
function updatePeek(){
  const html = toastNow ? toastNow : liveInfo();
  const want = toastNow ? 2 : (html ? 1 : 0);
  if(want && L.live.dataset.html!==html){ L.live.innerHTML=html; L.live.dataset.html=html; }
  if(want!==peek){ peek=want; invoke('notch_peek',{kind:want}).catch(()=>{}); if(state==='idle') applyShape(); }
}
function toast(icon,color,title,sub){
  if(toastQ.length>=4) toastQ.shift();
  toastQ.push(`<span class="lv-ic" style="background:${color}26;color:${color};font-size:16px">${icon}</span><div class="lv-txt"><div class="lv-t">${esc(title)}</div>${sub?`<div class="lv-s">${esc(sub)}</div>`:''}</div>`);
  pumpToasts();
}
function pumpToasts(){
  if(toastNow||state!=='idle'||dragging||!toastQ.length) return;
  toastNow=toastQ.shift(); updatePeek();
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ toastNow=null; updatePeek(); setTimeout(pumpToasts,450); },5000);
}
const alertMemo={}, workPrev={};
let alertsArmed=false; setTimeout(()=>{alertsArmed=true;},10000);
function checkEvents(){
  const levels=(cfg.alert_levels||[]).slice().sort((a,b)=>a-b);
  for(const p of providers()){
    const s=p.snap, ws=workState(p.id);
    if(alertsArmed && ws==='attention' && workPrev[p.id] && workPrev[p.id]!=='attention') toast('!',AMBER,`${p.name} needs you`,'Waiting for your reply');
    workPrev[p.id]=ws;
    if(s.status!=='ok' || !levels.length) continue;
    const rows=[], grouped=s.groups&&s.groups.length;
    if(!grouped) for(const w of s.windows) if(w.count==null) rows.push({k:w.id||w.label,label:w.label,w});
    for(const g of (s.groups||[])) for(const w of g.rows) rows.push({k:g.account+'/'+(w.id||w.label),label:`${g.title} · ${g.account} · ${w.label}`,w});
    for(const r of rows){
      const key=p.id+':'+r.k, pct=Math.round(r.w.used*100);
      const lvl=levels.filter(l=>pct>=l).pop()||0, m=alertMemo[key];
      if(m && alertsArmed){
        if(lvl>m.lvl) toast('!',tone(r.w.used),`${p.name} ${pct}% used`,r.label+(r.w.resets_at?' · '+resetCopy(r.w.resets_at):''));
        else if(m.max>=50 && pct<10) toast('✓',AMPLE,p.id==='deepseek'?'DeepSeek topped up':`${p.name} quota reset`,r.label);
      }
      alertMemo[key]={lvl, max: pct<10 ? pct : Math.max(m?m.max:0,pct)};
    }
  }
}
let dsPrevPeak=null;
setInterval(()=>{
  updatePeek(); renderClosed();
  if(state==='panel' && curTab!=='settings') renderPage(curTab);
  if(dsSnap.status==='absent') return;
  const {peak,next}=dsPricing();
  if(dsPrevPeak!==null && peak!==dsPrevPeak) toast(peak?'⏱':'☾', peak?'#FF8A3D':AMPLE, peak?'DeepSeek peak pricing started':'DeepSeek off-peak · 50% cheaper', (peak?'Off-peak again ':'Until ')+whenCopy(next));
  dsPrevPeak=peak;
},30000);

/* ---------- History ---------- */
const HIST_KEY='cn-hist-v1', HIST_MS=7*864e5, HIST_STEP=15*6e4;
let hist={};
try{ hist=JSON.parse(localStorage.getItem(HIST_KEY)||'{}')||{}; }catch{ hist={}; }
function recordHistory(){
  const now=Date.now(); let dirty=false;
  for(const p of providers()){
    const s=p.snap; if(s.status!=='ok') continue;
    const rows=[];
    if(!(s.groups&&s.groups.length)) for(const w of s.windows) if(w.count==null) rows.push([w.id||w.label,w]);
    for(const g of (s.groups||[])) for(const w of g.rows) rows.push([g.account+'/'+(w.id||w.label),w]);
    for(const [k,w] of rows){
      const key=p.id+':'+k, a=hist[key]||(hist[key]=[]), last=a[a.length-1], u=Math.round(w.used*1000)/1000;
      if(last && now-last[0]<HIST_STEP && Math.abs(last[1]-u)<0.01) continue;
      a.push([now,u]); dirty=true;
      while(a.length&&now-a[0][0]>HIST_MS) a.shift();
    }
  }
  if(dirty){ try{ localStorage.setItem(HIST_KEY,JSON.stringify(hist)); }catch{} }
}
function sinceReset(a){ let i=a.length-1; while(i>0 && a[i-1][1]<=a[i][1]+0.15) i--; return a.slice(i); }
function forecast(key,w){
  if(!w.resets_at) return null;
  const now=Date.now(), seg=sinceReset(hist[key]||[]).filter(p=>now-p[0]<6*36e5);
  if(seg.length<3) return null;
  const first=seg[0], last=seg[seg.length-1], dt=last[0]-first[0];
  if(dt<60*6e4) return null;
  const rate=(last[1]-first[1])/dt;
  if(rate<=1e-12) return {ok:true,text:'Barely moving lately — no risk of running out'};
  const eta=now+(1-Math.min(w.used,1))/rate;
  if(eta>=w.resets_at) return {ok:true,text:'At this pace it lasts until the reset'};
  return {ok:false,text:`At this pace it runs out ${whenCopy(eta)}`};
}
function spark(key){
  const now=Date.now(), a=(hist[key]||[]).filter(p=>now-p[0]<864e5);
  if(a.length<2 || a[a.length-1][0]-a[0][0]<36e5) return '';
  const W=300, H=24, t0=now-864e5;
  const pts=a.map(([t,u])=>`${((t-t0)/864e5*W).toFixed(1)},${(H-1-Math.min(u,1)*(H-2)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-opacity=".7" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="spark-l"><span>24h ago</span><span>now</span></div>`;
}
const tipsSeen=new Set();
function checkTips(){
  for(const p of providers()){
    if(!(p.snap.groups&&p.snap.groups.length)||p.snap.status!=='ok') continue;
    for(const t of accountTips(p.snap.groups)){ if(tipsSeen.has(t.key)) continue; tipsSeen.add(t.key); if(alertsArmed) toast('↪',AMPLE,t.title,t.sub); }
  }
}
function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return 'Resetting…';
  if(diff<60*60*1000) return `Resets in ${Math.max(1,Math.round(diff/60000))} min`;
  const d=new Date(ms), t=hm(ms);
  if(diff<24*60*60*1000) return `Resets at ${t}`;
  return `Resets ${d.toLocaleDateString('en-US',{weekday:'short'})} ${t}`;
}
function ago(ms){ const m=Math.round((Date.now()-ms)/60000); return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`; }
const STATE_DOT={running:RUNGREEN,attention:AMBER,done:'#57c7ff'};
const QUOTA_GLYPH={claude:'claude',codex:'codex',antigravity:'gemini',cursor:'cursor'};
function soonCopy(ms){
  if(!ms) return '';
  const m=Math.round((ms-Date.now())/60000);
  if(m<=0) return 'now';
  if(m<60) return `in ${m}m`;

  return h<24 ? `in ${h}h ${m%60}m` : `in ${Math.floor(h/24)}d ${h%24}h`;
}
function accountTips(groups){
  const by={};

  const tips=[];
  for(const list of Object.values(by)){
    if(list.length<2) continue;
    list.sort((a,b)=>a.left-b.left);
    const lo=list[0], hi=list[list.length-1];
    if(lo.left<0.2 && hi.left>=0.5) tips.push({key:lo.g.title+'|'+lo.g.account+'|'+hi.g.account, title:`${lo.g.title}: switch to ${hi.g.account}`,
      sub:`${lo.g.account} has ${Math.round(lo.left*100)}% left · ${hi.g.account} has ${Math.round(hi.left*100)}%`});
  }

}

    h+=`<div class="q-group"><div class="q-head">${icon}<span class="q-title">${esc(g.title)}</span>${g.plan?`<span class="q-plan">${esc(g.plan)}</span>`:''}<span class="q-acct">${esc(g.account)}</span></div>`;

/* ---------- Closed pill: the tightest quota and the next reset ---------- */
function worstAndNext(){
  const now=Date.now(); let worst=null, next=null;
  for(const p of providers()){
    if(p.snap.status==='needsAuth') continue;
    const h=headlineOf(p.snap);
    if(h&&h.count==null&&(!worst||h.used>worst.h.used)) worst={p,h};
    for(const w of p.snap.windows) if(w.count==null&&w.resets_at&&w.resets_at>now&&(!next||w.resets_at<next.w.resets_at)) next={p,w};
  }
  return {worst,next};
}
function closedHtml(vertical){

  if(!worst) return `<span class="c-dot"></span>`;
  const u=Math.min(worst.h.used,1), col=tone(u);
  return `<span class="c-ring">${ring22(u,col)}${glyphHtml(worst.p,true)||esc(worst.p.glyph)}</span><span class="c-pct" style="color:${col}">${Math.round(u*100)}%</span>`
    +(vertical?'':'<span class="c-gap"></span>')+(working?'<span class="c-work" title="Working"></span>':'')
    +(next?`<span class="c-reset">↻ ${esc(soonCopy(next.w.resets_at).replace(/^in /,''))}</span>`:'');

/* The card opens on the free side of the strip, level with the hovered ring, and stays inside the window */
function placeCard(){
  const cell=L.strip.querySelector(`.cell[data-p="${cardId}"]`); if(!cell) return;
  // Measured rects include the size-setting zoom; left/top are set in unzoomed CSS px, so divide it out
  const z=zoomVal, un=r=>({left:r.left/z,top:r.top/z,right:r.right/z,bottom:r.bottom/z,width:(r.right-r.left)/z,height:(r.bottom-r.top)/z});
  const cr=un(cell.getBoundingClientRect()), ir=un(targetRect()), W=innerWidth/z, H=innerHeight/z;
  const cw=262; cardEl.style.maxHeight='';
  let left, top;
  if(side()){
    left = edge==='right' ? ir.left-cw-10 : ir.right+10;
    const ch=Math.min(cardEl.scrollHeight, H-16);
    top=Math.round(cr.top+cr.height/2-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
  }else{

    cardEl.style.maxHeight=Math.max(120,room)+'px';

    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',gemini:'Sign in to Antigravity to see usage.',commandcode:'Add a Command Code API key to see usage.',router9:'Connect 9Router to see usage.',deepseek:'Add a DeepSeek API key to see your balance.'}[p.id]||'';

      for(const a of acts.slice(0,5)) html+=`<div class="s-row"><span class="s-dot" style="background:${a.state==='waiting'?AMBER:RUNGREEN}"></span>${esc(a.name)}<span style="margin-left:auto">${esc(a.detail)}</span></div>`;

/* one click handler for the strip, the card and the panel */
function onClick(e){
  const t=e.target.closest('[data-tab],[data-go],[data-detail],[data-act],[data-set],[data-toggle],[data-theme-pick],[data-hide],[data-conn],[data-sid],.cell');
  if(!t||moved) return;
  const d=t.dataset;
  if(t.classList.contains('cell')){ detailId=d.p; openPanel('detail'); return; }
  if(d.tab){ setTab(d.tab); return; }
  if(d.go){ detailId=d.go; setTab('detail'); return; }
  if(d.detail){ detailId=d.detail; renderPage('detail'); return; }
  if(d.sid){ closeAll(); invoke('focus_session',{id:d.sid}).then(ok=>{ if(ok===false) toast('!',AMBER,'Couldn’t bring that session to the front','Its window may be closed or hidden in the tray'); }).catch(()=>{}); return; }
  if(d.act==='more'){ openPanel('usage'); return; }
  if(d.act==='back'){ state='open'; renderStrip(); applyShape(); return; }
  if(d.act==='keys'){ invoke('open_settings').catch(()=>{}); closeAll(); return; }
  if(d.act==='refresh'){ invoke('refresh_usage').catch(()=>{}); notice('Refreshing usage…'); return; }
  if(d.act==='tab-r9'){ openPanel('r9'); return; }
  if(d.act==='conns-reload'){ conns=null; connsErr=''; renderPage('r9'); return; }
  if(d.set){
    const v=JSON.parse(d.val);
    if(d.set==='pos'){ v==='free' ? setPref('free',true) : setPref('edge',v); }
    else if(d.set==='alerts') setPref('alert_levels', v===''?[]:String(v).split(',').map(Number));
    else setPref(d.set,v);
    return;
  }
  if(d.toggle){ t.classList.toggle('on'); setPref(d.toggle,t.classList.contains('on')); return; }
  if(d.themePick){ setPref('theme',d.themePick); return; }
  if(d.hide){ const hid=new Set(cfg.hidden_providers||[]); hid.has(d.hide)?hid.delete(d.hide):hid.add(d.hide); setPref('hidden_providers',[...hid]); return; }
  if(d.conn){
    const c=(conns||[]).find(x=>x.id===d.conn); if(!c||t.disabled) return;
    const want=!c.active; t.disabled=true; t.classList.toggle('on',want);
    invoke('router9_set_active',{id:c.id,active:want}).then(()=>{ c.active=want; connsErr=''; })
      .catch(err=>{ connsErr=String(err); t.classList.toggle('on',!want); })
      .finally(()=>{ t.disabled=false; if(curTab==='r9') renderPage('r9'); });
  }
}

/* horizontal swipe (trackpad) or Shift+wheel over the pages moves between tabs */

  if(!dx) return;
  e.preventDefault(); swipeAcc+=dx; clearTimeout(swipeT); swipeT=setTimeout(()=>swipeAcc=0,220);

/* ---------- Hit rectangles for the Rust click-through / hover poll ----------

   cursor at once), plus the card when it shows. Physical px, relative to the window. */
function physRect(r){const k=window.devicePixelRatio||1;return [r.left*k,r.top*k,(r.right-r.left)*k,(r.bottom-r.top)*k];}
function targetRect(){
  const [w,h]=geom(), W=innerWidth, H=innerHeight, a=parseFloat(root.style.getPropertyValue('--along'))||.5;
  const z=zoomNow();
  const tw=w*z, th=h*z;
  switch(edge){
    case 'top': case 'free': return {left:W*a-tw/2,top:0,right:W*a+tw/2,bottom:th};
    case 'bottom': return {left:W*a-tw/2,top:H-th,right:W*a+tw/2,bottom:H};
    case 'right': return {left:W-tw,top:H*a-th/2,right:W,bottom:H*a+th/2};
    default: return {left:0,top:H*a-th/2,right:tw,bottom:H*a+th/2};
  }
}
function reportRects(){
  if(dragging) return;
  const rects=[physRect(island.getBoundingClientRect()), physRect(targetRect())];
  if(cardEl.classList.contains('show')) rects.push(physRect(cardEl.getBoundingClientRect()));
  invoke('update_island_rect',{rects}).catch(()=>{});
}
let burstI=null;
function burstRects(){ reportRects(); clearInterval(burstI); let n=0; burstI=setInterval(()=>{ reportRects(); if(++n>20) clearInterval(burstI); },40); }

/* ---------- Diagnostics + zoom ---------- */
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function designWidth(){ return side()?WIN.tall[0]:WIN.wide[0]; } // the window keeps this size even while dragged
let zoomVal=1;
function zoomNow(){ return zoomVal; }
function fitZoom(){
  const z=Math.min(3,Math.max(0.4,innerWidth/designWidth()));
  zoomVal=(Math.abs(z-1)>0.02)?z:1;
  document.documentElement.style.zoom=zoomVal===1?'':String(zoomVal);
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)} edge=${edge}`);
  invoke('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
  burstRects();
}
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(reportDpr,80);});

/* ---------- Hover (from the Rust cursor poll) ---------- */
let dwellT=null, closeT=null;
listen('island_hover',e=>{
  if(dragging) return;
  if(e.payload){
    clearTimeout(closeT);
    if(state==='idle' && !dwellT) dwellT=setTimeout(()=>{ dwellT=null; openStrip(); },140);
  }else{
    clearTimeout(dwellT); dwellT=null;
    if(state!=='idle'){ clearTimeout(closeT); closeT=setTimeout(closeAll,300); }
  }
}).catch(()=>{});

/* ---------- Drag ----------
   Press and move more than 4 px: the island lifts off as a pill that follows the cursor (Rust moves
   the window) and, on release, snaps to the nearest edge right where it was let go — or stays put
   floating when "Float" is on — settling with a small bounce. The pill, the strip and the panel's tab
   row are grips; buttons and switches stay buttons. */
let moved=false;
function beginPress(e){
  if(e.button!==0) return;
  if(e.target.closest('button:not(.cell),.sw,.seg,.swatch,.chip,.tile,.page,#card')) return;
  press={x:e.clientX,y:e.clientY}; moved=false;
}
island.addEventListener('mousedown',beginPress);
document.addEventListener('mousemove',e=>{
  if(!press||dragging) return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; moved=true;
    clearTimeout(closeT); clearTimeout(dwellT); dwellT=null;
    hideCard(true);
    // Rust centres the window on the cursor, so the pill sits in the middle of it — never cut off at an edge
    $('dragpill').innerHTML=closedHtml(false);
    state='idle'; applyShape();
    root.dataset.drag='1';
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;root.dataset.drag='0';});
  }
});
document.addEventListener('mouseup',()=>{ press=null; setTimeout(()=>moved=false,0); });
// The window moved under the cursor, so the page may never see that drag's mouseup: clear the
// "just dragged" flag here too, or it would swallow the next click
listen('drag_land',()=>{ root.dataset.drag='2'; }).catch(()=>{});
listen('drag_end',()=>{ dragging=false; press=null; setTimeout(()=>moved=false,60); root.dataset.drag='0'; burstRects(); setTimeout(pumpToasts,400); }).catch(()=>{});

function notice(msg){ const n=$('notice'); n.textContent=String(msg||''); n.classList.add('show'); clearTimeout(n._h); n._h=setTimeout(()=>n.classList.remove('show'),4000); }

/* ---------- Placement (from Rust): the edge, and where along the window the island sits ---------- */
function applyPlacement(p){
  if(!p||!p.edge) return;
  edge=p.edge; root.dataset.edge=edge;
  root.style.setProperty('--along',String(p.along??.5));
  L.strip.dataset.key=''; L.closed.dataset.html='';
  fitZoom(); renderClosed(); if(state==='open') renderStrip();
  applyShape();
}
listen('placement',e=>applyPlacement(e.payload)).catch(()=>{});
invoke('get_placement').then(applyPlacement).catch(()=>{});

/* ---------- Data ---------- */
const onSnap=(setter)=>e=>{ setter(e.payload); renderAll(); };
listen('usage',onSnap(p=>usage=p||usage)).catch(e=>notice('listen(usage) failed: '+e));
listen('state',onSnap(p=>stateSnap=p||stateSnap)).catch(()=>{});
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',onSnap(p=>codexSnap=p||codexSnap)).catch(()=>{});
listen('cursor',onSnap(p=>cursorSnap=p||cursorSnap)).catch(()=>{});
listen('antigravity',onSnap(p=>agSnap=p||agSnap)).catch(()=>{});
listen('commandcode',onSnap(p=>ccSnap=p||ccSnap)).catch(()=>{});
listen('router9',onSnap(p=>{ r9Snap=p||r9Snap; })).catch(()=>{});
listen('deepseek',onSnap(p=>dsSnap=p||dsSnap)).catch(()=>{});
listen('glyphs',onSnap(p=>glyphs=p||glyphs)).catch(()=>{});
listen('activity',onSnap(p=>activity=p||activity)).catch(()=>{});
const get=(cmd,setter)=>invoke(cmd).then(v=>{ setter(v); renderAll(); }).catch(()=>{});
get('get_usage',v=>usage=v||usage); get('get_codex',v=>codexSnap=v||codexSnap); get('get_cursor',v=>cursorSnap=v||cursorSnap);
get('get_antigravity',v=>agSnap=v||agSnap); get('get_commandcode',v=>ccSnap=v||ccSnap); get('get_router9',v=>r9Snap=v||r9Snap);
get('get_deepseek',v=>dsSnap=v||dsSnap); get('get_state',v=>stateSnap=v||stateSnap); get('get_activity',v=>activity=v||activity);
get('get_glyphs',v=>glyphs=v||glyphs);

function applyCfg(){
  root.style.opacity=(cfg.opacity!=null?cfg.opacity:1);
  root.dataset.theme=(!cfg.theme||cfg.theme==='dark')?'midnight':cfg.theme;
  renderAll();
  if(state==='panel'&&curTab==='settings') renderPage('settings');
}
listen('config',e=>{cfg=e.payload||cfg;applyCfg();}).catch(()=>{});
invoke('get_config').then(c=>{cfg=c||cfg;applyCfg();}).catch(()=>{});
reportDpr();
applyShape();
</script>
</body>
