<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* The Dynamic Island. One surface (#shape) is reshaped by animating its clip-path with a spring:
     closed it is a small pill welded to the middle of the top, left or right screen edge (concave
     fillets where it meets the screen, like a MacBook notch); it springs into a Live Activity, an
     alert, or the full panel with tabs. The window always matches the current shape (Rust sizes it),
     and every inset below is relative (% of the window), so the shape morphs smoothly while the
     window changes size underneath it. Only clip-path, transform and opacity animate: a transparent
     always-on-top window repaints through the compositor, and animating layout there stutters. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}

  /* colour is set here, not on body: the theme variables live on #root, and at body level
     var(--text) is undefined — everything without its own colour came out black on black */
  #root{
    position:relative;width:100%;height:100%;color:var(--text);
    --fil:12px;--pw:220px;--ph:34px;--sw:34px;--sh:150px;--fh:40px;--r:28px;
    --ink:#000;--ink2:#141417;--ink3:#1f1f24;--line:#2a2a30;--text:#f2f2f5;--mute:#8d8d96;--accent:#0A84FF;
    --spring:cubic-bezier(.34,1.56,.64,1);--soft:cubic-bezier(.22,1,.36,1);--open-ms:620ms;--close-ms:380ms;
  }
  /* ---------- Themes: surfaces and the accent; quota colours stay semantic everywhere ---------- */
  #root[data-theme="graphite"]{--ink:#1b1b1e;--ink2:#26262a;--ink3:#303035;--line:#3a3a40;--accent:#c7c7d1}
  #root[data-theme="ocean"]{--ink:#03131f;--ink2:#0a2233;--ink3:#0f2e44;--line:#163c56;--mute:#86a3b5;--accent:#22d3ee}
  #root[data-theme="sunset"]{--ink:#170a0b;--ink2:#27130f;--ink3:#351b15;--line:#46261c;--mute:#b39488;--accent:#fb923c}
  #root[data-theme="forest"]{--ink:#06130c;--ink2:#0d2317;--ink3:#133120;--line:#1a3f2a;--mute:#8fae9c;--accent:#34d399}
  #root[data-theme="rose"]{--ink:#16080f;--ink2:#27111c;--ink3:#351726;--line:#461f33;--mute:#b391a4;--accent:#f472b6}
  #root[data-theme="glass"]{--ink:rgba(16,16,20,.74);--ink2:rgba(255,255,255,.06);--ink3:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--accent:#ffffff}

  /* ---------- The surface ---------- */
  #shape{position:absolute;inset:0;background:var(--ink);pointer-events:none;
    transition:clip-path var(--close-ms) var(--soft)}
  #root[data-state="open"] #shape, #root[data-peek="1"] #shape, #root[data-peek="2"] #shape{transition:clip-path var(--open-ms) var(--spring)}
  /* top edge */
  #root[data-edge="top"] #shape{clip-path:inset(0 calc(50% - var(--pw) / 2) calc(100% - var(--ph)) calc(50% - var(--pw) / 2) round 0 0 calc(var(--ph) / 2) calc(var(--ph) / 2))}
  #root[data-edge="top"][data-peek="1"] #shape{clip-path:inset(0 var(--fil) 0 var(--fil) round 0 0 21px 21px)}
  #root[data-edge="top"][data-peek="2"] #shape{clip-path:inset(0 var(--fil) 0 var(--fil) round 0 0 26px 26px)}
  #root[data-edge="top"][data-state="open"] #shape{clip-path:inset(0 var(--fil) 0 var(--fil) round 0 0 var(--r) var(--r))}
  /* right edge */
  #root[data-edge="right"] #shape{clip-path:inset(calc(50% - var(--sh) / 2) 0 calc(50% - var(--sh) / 2) calc(100% - var(--sw)) round calc(var(--sw) / 2) 0 0 calc(var(--sw) / 2))}
  #root[data-edge="right"][data-peek="1"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round 21px 0 0 21px)}
  #root[data-edge="right"][data-peek="2"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round 26px 0 0 26px)}
  #root[data-edge="right"][data-state="open"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round var(--r) 0 0 var(--r))}
  /* left edge */
  #root[data-edge="left"] #shape{clip-path:inset(calc(50% - var(--sh) / 2) calc(100% - var(--sw)) calc(50% - var(--sh) / 2) 0 round 0 calc(var(--sw) / 2) calc(var(--sw) / 2) 0)}
  #root[data-edge="left"][data-peek="1"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round 0 21px 21px 0)}
  #root[data-edge="left"][data-peek="2"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round 0 26px 26px 0)}
  #root[data-edge="left"][data-state="open"] #shape{clip-path:inset(var(--fil) 0 var(--fil) 0 round 0 var(--r) var(--r) 0)}
  /* floating freely: no edge, a fully rounded island */
  #root[data-mode="free"] #shape{clip-path:inset(0 calc(50% - var(--pw) / 2) calc(100% - var(--fh)) calc(50% - var(--pw) / 2) round calc(var(--fh) / 2))}
  #root[data-mode="free"][data-peek="1"] #shape{clip-path:inset(0 round 21px)}
  #root[data-mode="free"][data-peek="2"] #shape{clip-path:inset(0 round 30px)}
  #root[data-mode="free"][data-state="open"] #shape{clip-path:inset(0 round var(--r))}

  /* Fillets: the concave curve where the island meets the screen edge. An FIL-sized square of ink
     with a circle punched out of its outer corner, riding along the island's sides. */
  .fil{position:absolute;width:var(--fil);height:var(--fil);pointer-events:none;display:none;
    transition:left var(--close-ms) var(--soft),right var(--close-ms) var(--soft),top var(--close-ms) var(--soft),bottom var(--close-ms) var(--soft)}
  #root[data-state="open"] .fil,#root[data-peek="1"] .fil,#root[data-peek="2"] .fil{
    transition:left var(--open-ms) var(--spring),right var(--open-ms) var(--spring),top var(--open-ms) var(--spring),bottom var(--open-ms) var(--spring)}
  #root[data-mode="dock"] .fil{display:block}
  #root[data-edge="top"] .fil{top:0}
  #root[data-edge="top"] .fil-a{left:calc(50% - var(--pw) / 2 - var(--fil));background:radial-gradient(circle at 0 100%,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}
  #root[data-edge="top"] .fil-b{right:calc(50% - var(--pw) / 2 - var(--fil));background:radial-gradient(circle at 100% 100%,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}
  #root[data-edge="top"]:is([data-state="open"],[data-peek="1"],[data-peek="2"]) .fil-a{left:0}
  #root[data-edge="top"]:is([data-state="open"],[data-peek="1"],[data-peek="2"]) .fil-b{right:0}
  #root[data-edge="right"] .fil{right:0}
  #root[data-edge="left"] .fil{left:0}
  #root[data-edge="right"] .fil-a,#root[data-edge="left"] .fil-a{top:calc(50% - var(--sh) / 2 - var(--fil))}
  #root[data-edge="right"] .fil-b,#root[data-edge="left"] .fil-b{bottom:calc(50% - var(--sh) / 2 - var(--fil))}
  #root:is([data-edge="right"],[data-edge="left"]):is([data-state="open"],[data-peek="1"],[data-peek="2"]) .fil-a{top:0}
  #root:is([data-edge="right"],[data-edge="left"]):is([data-state="open"],[data-peek="1"],[data-peek="2"]) .fil-b{bottom:0}
  #root[data-edge="right"] .fil-a{background:radial-gradient(circle at 0 0,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}
  #root[data-edge="right"] .fil-b{background:radial-gradient(circle at 0 100%,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}
  #root[data-edge="left"] .fil-a{background:radial-gradient(circle at 100% 0,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}
  #root[data-edge="left"] .fil-b{background:radial-gradient(circle at 100% 100%,transparent calc(var(--fil) - .5px),var(--ink) calc(var(--fil) + .5px))}

  /* ---------- Closed: the compact pill ---------- */
  #closed{position:absolute;display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text);
    transition:opacity .2s var(--soft),transform .45s var(--spring)}
  #root[data-edge="top"] #closed,#root[data-mode="free"] #closed{top:0;left:50%;width:var(--pw);height:var(--ph);margin-left:calc(var(--pw) / -2);padding:0 12px 0 6px}
  #root[data-mode="free"] #closed{height:var(--fh)}
  #root[data-edge="right"][data-mode="dock"] #closed,#root[data-edge="left"][data-mode="dock"] #closed{
    top:50%;width:var(--sw);height:var(--sh);margin-top:calc(var(--sh) / -2);flex-direction:column;justify-content:center;gap:6px;padding:8px 0}
  #root[data-edge="right"][data-mode="dock"] #closed{right:0}
  #root[data-edge="left"][data-mode="dock"] #closed{left:0}
  #root:is([data-state="open"],[data-peek="1"],[data-peek="2"],[data-drag="1"]) #closed{opacity:0;pointer-events:none;transform:scale(.85)}
  .c-ring{position:relative;width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .c-ring svg{position:absolute;inset:0;width:100%;height:100%}
  .c-ring img{width:13px!important;height:13px!important;border-radius:3px}
  .c-ring .mark{display:flex;width:12px;height:12px;color:var(--text)} .c-ring .mark svg{position:static;width:12px;height:12px;fill:currentColor}
  .c-pct{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .c-gap{flex:1}
  .c-reset{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.8;margin:auto}
  #root:is([data-edge="right"],[data-edge="left"])[data-mode="dock"] .c-pct{font-size:10.5px}
  #root:is([data-edge="right"],[data-edge="left"])[data-mode="dock"] .c-reset{font-size:9.5px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .c-work{width:6px;height:6px;border-radius:50%;background:#28E07B;box-shadow:0 0 6px #28E07B;animation:pulse 1.1s steps(6) infinite}

  /* ---------- Peek: Live Activity and alerts ---------- */
  #live{position:absolute;display:flex;align-items:center;gap:9px;padding:0 14px 0 8px;cursor:pointer;
    opacity:0;pointer-events:none;transform:scale(.92);transition:opacity .18s var(--soft),transform .5s var(--spring)}
  #root[data-edge="top"] #live{inset:0 var(--fil)}
  #root:is([data-edge="right"],[data-edge="left"]) #live{inset:var(--fil) 0}
  #root[data-mode="free"] #live{inset:0}
  #root[data-edge="right"][data-mode="dock"] #live{padding-left:10px}
  #root[data-edge="left"][data-mode="dock"] #live{padding:0 10px 0 14px}
  #root[data-state="idle"]:is([data-peek="1"],[data-peek="2"]) #live{opacity:1;pointer-events:auto;transform:none;transition-delay:.08s}
  .lv-ic{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:12px;font-weight:700;color:var(--text)}
  #root[data-peek="2"] .lv-ic{width:38px;height:38px}
  .lv-ic img{width:16px!important;height:16px!important;border-radius:4px}
  .lv-ic .mark{display:flex;width:16px;height:16px;color:var(--text)}
  .lv-ic .mark svg{width:16px;height:16px;fill:currentColor}
  .lv-ic svg.lv-ring{position:absolute;inset:0;width:100%;height:100%}
  .lv-txt{min-width:0;flex:1;line-height:1.25}
  .lv-t{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #root[data-peek="2"] .lv-t{font-size:13.5px}
  .lv-s{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- Open: the panel ---------- */
  #panel{position:absolute;display:flex;flex-direction:column;opacity:0;pointer-events:none;
    transform:translateY(-8px) scale(.97);transition:opacity .16s var(--soft),transform .4s var(--soft)}
  #root[data-edge="top"] #panel{inset:0 var(--fil);padding:10px 16px 14px;transform-origin:top center}
  #root[data-edge="right"][data-mode="dock"] #panel{inset:var(--fil) 0;padding:14px 14px 14px 16px;transform:translateX(10px) scale(.97);transform-origin:right center}
  #root[data-edge="left"][data-mode="dock"] #panel{inset:var(--fil) 0;padding:14px 16px 14px 14px;transform:translateX(-10px) scale(.97);transform-origin:left center}
  #root[data-mode="free"] #panel{inset:0;padding:12px 16px 14px}
  #root[data-state="open"] #panel{opacity:1;pointer-events:auto;transform:none;transition:opacity .26s var(--soft) .1s,transform .6s var(--spring) .06s}

  /* tabs: a segmented control with a sliding ink */
  #tabs{position:relative;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--ink2);align-self:center;flex:0 0 auto;cursor:grab}
  #tabs button{position:relative;z-index:1;font-family:inherit;font-size:12px;font-weight:600;line-height:1;color:var(--mute);background:transparent;border:0;border-radius:9px;padding:7px 13px;cursor:pointer;transition:color .2s}
  #tabs button.on{color:var(--text)}
  #tabs button[hidden]{display:none}
  #tabInk{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--ink3);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
    transition:transform .5s var(--spring),width .5s var(--spring)}
  #pagesWrap{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:10px}
  #pages{display:flex;height:100%;transition:transform .55s var(--spring)}
  .page{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;padding:2px 2px 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .page::-webkit-scrollbar{width:6px} .page::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .page.enter > *{animation:rise .45s var(--spring) both}
  .page.enter > *:nth-child(2){animation-delay:.03s} .page.enter > *:nth-child(3){animation-delay:.06s} .page.enter > *:nth-child(4){animation-delay:.09s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}

  /* Usage: a tile per provider */
  .sum{font-size:11.5px;color:var(--mute);margin:0 2px 10px;display:flex;gap:10px;flex-wrap:wrap}
  .sum b{color:var(--text);font-weight:650}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
  .tile{background:var(--ink2);border:1px solid transparent;border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
    transition:transform .35s var(--spring),border-color .2s,background .2s}
  .tile:hover{transform:translateY(-2px);border-color:var(--line);background:var(--ink3)}
  .tile:active{transform:scale(.96)}
  .t-name{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .t-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .t-sub{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:13px}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible}
  .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.5px}
  .glyph.small{font-size:14px}
  .glyph img,.glyph svg{display:block;pointer-events:none}
  .glyph .mark{display:block;width:24px;height:24px;color:var(--text)} .glyph .mark svg{width:24px;height:24px;fill:currentColor}
  .glyph img.png{width:24px;height:24px;object-fit:contain}
  .glyph img.appicon{width:28px;height:28px;border-radius:8px;object-fit:cover}
  .dim{opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* steps(): a 60 fps SVG animation in a transparent topmost window slows the whole desktop compositor */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center;transform-box:fill-box}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}

  /* Details */
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--mute);background:var(--ink2);border:1px solid transparent;border-radius:99px;padding:5px 10px 5px 6px;cursor:pointer;transition:all .2s}
  .chip.on{color:var(--text);border-color:var(--accent);background:var(--ink3)}
  .chip img{width:14px!important;height:14px!important;border-radius:3px}
  .chip .mark{display:flex;width:14px;height:14px} .chip .mark svg{width:14px;height:14px;fill:currentColor}
  .chip .cdot{width:8px;height:8px;border-radius:50%}
  .d-card{background:var(--ink2);border-radius:16px;padding:14px}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .c-head img{width:16px!important;height:16px!important;border-radius:4px}
  .c-head .mark{display:inline-flex;width:16px;height:16px;color:var(--text)} .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--mute);margin-bottom:8px}
  .win{margin-top:12px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{font-weight:600;white-space:nowrap}
  .w-reset{color:var(--mute);font-size:11px;white-space:nowrap;margin-left:auto}
  .w-track{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:3px;transition:width .6s var(--spring)}
  .w-used{font-size:11px;color:var(--mute)}
  .w-fc{font-size:11px;margin-top:3px}
  .spark{display:block;width:100%;height:24px;margin-top:5px}
  .spark-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mute);opacity:.6;margin-top:1px}
  .c-note{font-size:12px;color:var(--mute);line-height:1.5;margin-top:8px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);padding:3px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-jump{cursor:pointer;border-radius:8px;margin:0 -6px;padding:4px 6px;transition:background .15s}
  .s-jump:hover{background:var(--ink3);color:var(--text)}
  .s-title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-go{font-size:11px;opacity:0;transition:opacity .15s} .s-jump:hover .s-go{opacity:.7}
  .btn{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text);background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;transition:transform .3s var(--spring),background .15s}
  .btn:hover{background:var(--line)} .btn:active{transform:scale(.95)}
  .btn.acc{background:var(--accent);color:#08080a;border-color:transparent}
  /* Quota Tracker groups (9Router, several Command Code accounts) */
  .q-group{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .q-group:first-child{margin-top:4px;border-top:none;padding-top:0}
  .q-head{display:flex;align-items:center;gap:6px;min-width:0}
  .q-head .mark{display:inline-flex;width:14px;height:14px;flex:0 0 auto} .q-head .mark svg{width:14px;height:14px;fill:currentColor}
  .q-head img{width:14px!important;height:14px!important;border-radius:3px;flex:0 0 auto}
  .q-title{font-size:12.5px;font-weight:700;white-space:nowrap}
  .q-plan{font-size:10px;color:var(--mute);background:var(--ink3);border-radius:99px;padding:1px 6px;white-space:nowrap}
  .q-acct{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;min-width:0}
  .q-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;align-items:baseline;margin-top:7px;font-size:11px}
  .q-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-pct{font-weight:600;font-variant-numeric:tabular-nums}
  .q-reset{color:var(--mute);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .q-bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
  .q-bar i{display:block;height:100%;border-radius:2px}
  .q-msg{font-size:11px;color:#c8a24a;margin-top:6px;line-height:1.4}
  .q-tip{font-size:11px;line-height:1.4;color:#bfeed3;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.18);border-radius:10px;padding:7px 9px;margin:4px 0 8px}

  /* Settings and 9Router connections: rows, switches, segments, swatches */
  .sec{background:var(--ink2);border-radius:16px;padding:12px 14px;margin-bottom:8px}
  .sec h4{margin:0 0 8px;font-size:11px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:10px;min-height:32px}
  .row + .row{border-top:1px solid var(--line)}
  .row .rl{flex:1;min-width:0;font-size:12.5px}
  .row .rs{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw{position:relative;width:38px;height:22px;flex:0 0 auto;border-radius:99px;background:var(--ink3);border:0;cursor:pointer;transition:background .25s}
  .sw::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#f2f2f5;transition:transform .45s var(--spring)}
  .sw.on{background:var(--accent)} .sw.on::before{transform:translateX(16px);background:#fff}
  #root[data-theme="glass"] .sw.on::before,#root[data-theme="graphite"] .sw.on::before{background:#111}
  .sw:disabled{opacity:.5;cursor:default}
  .seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--ink3);flex-wrap:wrap}
  .seg button{flex:1;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--mute);background:transparent;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;transition:all .25s var(--soft);white-space:nowrap}
  .seg button.on{background:var(--accent);color:#08080a}
  #root[data-theme="glass"] .seg button.on{color:#000}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .35s var(--spring)}
  .swatch:hover{transform:scale(1.1)} .swatch.on{border-color:var(--text)}
  .swatch i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2)}
  .pchips{display:flex;gap:6px;flex-wrap:wrap}
  .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .foot .by{margin-left:auto;font-size:10.5px;color:var(--mute)}
  .conn-g{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:10px 2px 4px}

  /* ---------- Dragging: the island travels as a plain pill ---------- */
  #dragpill{position:absolute;left:50%;top:50%;width:150px;height:44px;margin:-22px 0 0 -75px;border-radius:22px;background:var(--ink);
    box-shadow:0 0 0 1px var(--line),0 10px 26px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px;padding:0 14px 0 9px;
    opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .15s,transform .5s var(--spring)}
  #root[data-drag="1"] #dragpill{opacity:1;transform:scale(1)}
  #root[data-drag="1"] :is(#shape,.fil,#closed,#live,#panel){opacity:0!important;pointer-events:none!important}

  #notice{position:absolute;left:16px;right:16px;bottom:10px;font-size:10.5px;color:var(--mute);background:var(--ink2);border-radius:8px;padding:5px 8px;display:none}
  #notice.show{display:block}
</style>
</head>
<body>
<div id="root" data-edge="top" data-mode="dock" data-state="idle" data-peek="0" data-theme="midnight">
  <div id="shape"></div>
  <div class="fil fil-a"></div><div class="fil fil-b"></div>
  <div id="closed"></div>
  <div id="live"></div>
  <div id="panel">
    <div id="tabs">
      <div id="tabInk"></div>
      <button data-tab="usage" class="on">Usage</button>
      <button data-tab="detail">Details</button>
      <button data-tab="r9" hidden>9Router</button>
      <button data-tab="settings">Settings</button>
    </div>
    <div id="pagesWrap"><div id="pages">
      <section class="page" data-page="usage"></section>
      <section class="page" data-page="detail"></section>
      <section class="page" data-page="r9"></section>
      <section class="page" data-page="settings"></section>
    </div></div>
  </div>
  <div id="dragpill"></div>
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const TRACK='#303030', AMBER='#FFBF00', RUNGREEN='#28E07B';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
let ccSnap={status:'absent',windows:[],fetched_at:0,note:''};
let r9Snap={status:'absent',windows:[],fetched_at:0,note:''};
let dsSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cfg={opacity:1,scale:1,edge:'top',drag_enabled:false,live_activity:true,alert_levels:[80,95],theme:'midnight',hide_fullscreen:true,hidden_providers:[]};
let glyphs={};
let activity=[];
let stateSnap={sessions:[],agg:'idle'};

const $=id=>document.getElementById(id);
const root=$('root'), closedEl=$('closed'), live=$('live'), panel=$('panel'), pagesEl=$('pages');

/* Geometry mirrored from main.rs (FIL, PILL_*, SIDE_*, FREE_H, LIVE, TOAST, OPEN_*, DRAG_*): only
   used to know which window width is "design size", for the DPI / size-setting zoom correction. */
const GEO={fil:12,pill:[220,34],side:[34,150],freeH:40,live:[300,42],toast:[380,60],openTop:[560,470],openSide:[430,520],drag:[170,60]};
const THEMES=[['midnight','Midnight','#000000','#0A84FF'],['graphite','Graphite','#1b1b1e','#c7c7d1'],['ocean','Ocean','#03131f','#22d3ee'],
  ['sunset','Sunset','#170a0b','#fb923c'],['forest','Forest','#06130c','#34d399'],['rose','Rose','#16080f','#f472b6'],['glass','Glass','#2a2a30','#ffffff']];

let state='idle', pendingShrink=null;
// Declared up here: designWidth() reads these during the first reportDpr(), before the rest of the script has run
let press=null, dragging=false, peekWin=0;
const dockEdge=()=> cfg.edge==='left'||cfg.edge==='right' ? cfg.edge : 'top';

/* ---------- Springs ----------
   CSS has no spring timing function, but linear() can carry one: a damped spring is simulated once
   and sampled into linear(0, …, 1). Overshoot and settle come for free; each property animates on
   its own curve, so width, height and corners move together as one liquid shape. */
function springCurve(stiffness,damping){
  let x=0,v=0,t=0; const dt=1/120, pts=[0];
  while(t<2){ const a=-stiffness*(x-1)-damping*v; v+=a*dt; x+=v*dt; t+=dt; pts.push(x); if(t>.2&&Math.abs(x-1)<.001&&Math.abs(v)<.01) break; }
  const step=Math.max(1,Math.floor(pts.length/60)), s=[];
  for(let i=0;i<pts.length;i+=step) s.push(+pts[i].toFixed(4));
  s.push(1);
  return {css:`linear(${s.join(',')})`, ms:Math.round(t*1000)};
}
if(CSS.supports('transition-timing-function','linear(0, 1)')){
  const open=springCurve(210,19), soft=springCurve(260,34);
  root.style.setProperty('--spring',open.css);
  root.style.setProperty('--soft',soft.css);
  root.style.setProperty('--open-ms',open.ms+'ms');
  root.style.setProperty('--close-ms',soft.ms+'ms');
}
const CLOSE_MS=Math.max(260,parseInt(getComputedStyle(root).getPropertyValue('--close-ms'))||380);

/* ---------- Open / close ---------- */
function openNotch(){
  clearTimeout(pendingShrink); clearTimeout(dwellTimer);
  if(state==='open') return;
  state='open';
  root.dataset.state='open'; // synchronously: requestAnimationFrame is not reliably scheduled in a never-focused window
  renderPanel(true);
  invoke('notch_expand',{on:true}).catch(e=>notice('notch_expand failed: '+e));
  armWatchdog();
}
function closeNotch(){
  clearTimeout(dwellTimer);
  if(state==='idle') return;
  state='idle';
  root.dataset.state='idle';
  invoke('set_expanded',{on:false,rects:null}).catch(()=>{});
  // The shape springs back into the pill first; the window follows once it has
  clearTimeout(pendingShrink);
  pendingShrink=setTimeout(()=>invoke('notch_expand',{on:false}).catch(()=>{}),CLOSE_MS);
  setTimeout(pumpToasts,CLOSE_MS+60);
  needLeave=true; reopenAfter=Date.now()+CLOSE_MS+900;
}
let needLeave=false, reopenAfter=0;

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // Claude Desktop's network traffic only counts when the hooks see no session at all
    if(!(stateSnap.sessions||[]).length && activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph;
}
function allProviders(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(ccSnap.status!=='absent') list.push({id:'commandcode',name:'Command Code',glyph:'Cc',snap:ccSnap});
  if(r9Snap.status!=='absent') list.push({id:'router9',name:'9Router',glyph:'9r',snap:r9Snap});
  if(dsSnap.status!=='absent') list.push({id:'deepseek',name:'DeepSeek',glyph:'Ds',snap:dsSnap});
  return list;
}
// Shown providers, in the chosen order (unlisted ids keep theirs, after)
function providers(){
  const list=allProviders();
  const hid=cfg.hidden_providers||[], ord=cfg.provider_order||[];
  const rank=id=>{ const i=ord.indexOf(id); return i<0 ? 100+list.findIndex(p=>p.id===id) : i; };
  const shown=list.filter(p=>!hid.includes(p.id)).sort((a,b)=>rank(a.id)-rank(b.id));
  return shown.length ? shown : list.slice(0,1);
}
function headlineOf(snap){
  if(!snap.windows.length) return null;
  const metered=snap.windows.filter(w=>w.count==null);
  if(metered.length) return metered.reduce((a,b)=> b.used>a.used?b:a);
  return snap.windows[0];
}
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>5*60*1000; }

function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}
function ring28(u,color){
  const C=2*Math.PI*10.5;
  return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2.5"/>`
    +(u==null?'':`<circle cx="12" cy="12" r="10.5" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(C*Math.min(u,1)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 12 12)"/>`)+`</svg>`;
}

/* ---------- DeepSeek pricing ----------
   Peak: Mon–Fri 01:00–04:00 and 06:00–10:00 UTC; every other hour is off-peak at half price
   (api-docs.deepseek.com/quick_start/pricing). */
const DS_PEAK=[[60,240],[360,600]];
function dsPeakAt(t){
  const d=new Date(t), w=d.getUTCDay();
  if(w<1||w>5) return false;
  const m=d.getUTCHours()*60+d.getUTCMinutes();
  return DS_PEAK.some(([a,b])=>m>=a&&m<b);
}
function dsPricing(t=Date.now()){
  const peak=dsPeakAt(t), d=new Date(t);
  const day0=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  for(let i=0;i<9;i++) for(const [a,b] of DS_PEAK) for(const m of [a,b]){
    const c=day0+i*864e5+m*6e4;
    if(c>t && dsPeakAt(c)!==peak) return {peak,next:c};
  }
  return {peak,next:null};
}
function hm(ms){ return new Date(ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }
function dsHoursLocal(){ const at=m=>hm(Date.UTC(2024,0,1,0,m)); return `${at(60)}–${at(240)} & ${at(360)}–${at(600)}`; }
function whenCopy(ms){
  if(!ms) return '';
  const d=new Date(ms), same=d.toDateString()===new Date().toDateString();
  return (same?'':d.toLocaleDateString('en-US',{weekday:'short'})+' ')+hm(ms)+' ('+soonCopy(ms)+')';
}
function shortMoney(s){
  const m=/^([$¥])([\d.]+)/.exec(s||''); if(!m) return null;
  const n=parseFloat(m[2]);
  return m[1]+(n>=100?Math.round(n):n.toFixed(1));
}
function renderDeepseek(snap){
  let h='';
  for(const w of snap.windows){
    const left=Math.max(0,Math.round((1-w.used)*100)), parts=(w.amount||'').split(' · ');
    h+=`<div class="win"><div class="w-row"><span class="w-label">${esc(w.label)}</span><span class="w-reset">${esc(parts[0]||'')}</span></div>
      <div class="w-track"><div class="w-fill" style="width:${left}%;background:${tone(w.used)}"></div></div>
      <div class="w-used">~${left}% of the last top-up left${parts.length>1?' · '+esc(parts.slice(1).join(' · ')):''}</div></div>`;
  }
  const {peak,next}=dsPricing(), col=peak?'#FF8A3D':AMPLE;
  h+=`<div class="win"><div class="w-row"><span class="w-label"><span class="s-dot" style="display:inline-block;background:${col};margin-right:6px"></span>${peak?'Peak pricing':'Off-peak · 50% cheaper'}</span></div>
    <div class="w-used">${peak?'Off-peak':'Peak'} starts ${esc(whenCopy(next))}</div>
    <div class="w-used">Peak hours: ${dsHoursLocal()}, weekdays</div></div>`;
  if(snap.note && !shortMoney(snap.note)) h+=`<div class="c-note">${esc(snap.note)}</div>`;
  return h;
}

/* ---------- Live Activity + alerts ---------- */
let peekShrinkT=null, toastQ=[], toastNow=null, toastT=null;
function liveInfo(){
  if(cfg.live_activity===false) return null;
  const ps=providers();
  const att=ps.find(p=>workState(p.id)==='attention');
  const run=ps.filter(p=>workState(p.id)==='running');
  const p=att||run[0]; if(!p) return null;
  const h=headlineOf(p.snap), metered=h&&h.count==null;
  const title=att?`${p.name} needs you`:`${p.name} working`;
  const what=workDetail(p.id);
  const sub=att ? (what||'Waiting for your reply')
    : [what, run.length>1?`+${run.length-1} more`:''].filter(Boolean).join(' · ') || (metered&&h.resets_at?resetCopy(h.resets_at):'');
  const ring=att
    ?`<svg class="lv-ring arc-pulse" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="none" stroke="${AMBER}" stroke-width="2"/></svg>`
    :`<svg class="lv-ring arc-spin" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="none" stroke="${RUNGREEN}" stroke-width="2" stroke-dasharray="20 79" stroke-linecap="round"/></svg>`;
  return `<span class="lv-ic">${ring}${glyphHtml(p,true)||esc(p.glyph)}</span>`
    +`<div class="lv-txt"><div class="lv-t">${esc(title)}</div>${sub?`<div class="lv-s">${esc(sub)}</div>`:''}</div>`
    +(metered?`<span class="lv-v" style="color:${tone(h.used)}">${Math.round(h.used*100)}%</span>`:'');
}
function workDetail(id){
  if(id==='claude'){
    const ss=stateSnap.sessions||[];
    const s=ss.find(s=>s.state==='attention')||ss.find(s=>s.state==='running');
    if(s) return s.title;
    return activity.some(a=>a.provider==='claude'&&a.state==='busy') ? 'Claude Desktop · streaming' : '';
  }
  const a=activity.find(a=>a.provider===id&&a.state==='waiting')||activity.find(a=>a.provider===id&&a.state==='busy');
  return a ? [a.name,a.detail].filter(Boolean).join(' · ') : '';
}
function updatePeek(){
  const html = toastNow ? toastNow : liveInfo();
  const want = toastNow ? 2 : (html ? 1 : 0);
  clearTimeout(peekShrinkT);
  if(want){
    if(live.dataset.html!==html){ live.innerHTML=html; live.dataset.html=html; }
    if(want!==peekWin){ peekWin=want; invoke('notch_peek',{kind:want}).catch(()=>{}); }
    root.dataset.peek=String(want);
  }else if(peekWin){
    root.dataset.peek='0'; // the shape springs back into the pill; the window follows
    peekShrinkT=setTimeout(()=>{ peekWin=0; invoke('notch_peek',{kind:0}).catch(()=>{}); },CLOSE_MS);
  }
}
function toast(icon,color,title,sub){
  if(toastQ.length>=4) toastQ.shift();
  toastQ.push(`<span class="lv-ic" style="background:${color}26;color:${color};font-size:16px">${icon}</span>`
    +`<div class="lv-txt"><div class="lv-t">${esc(title)}</div>${sub?`<div class="lv-s">${esc(sub)}</div>`:''}</div>`);
  pumpToasts();
}
function pumpToasts(){
  if(toastNow||state==='open'||dragging||!toastQ.length) return;
  toastNow=toastQ.shift(); updatePeek();
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ toastNow=null; updatePeek(); setTimeout(pumpToasts,CLOSE_MS+80); },5000);
}
const alertMemo={}, workPrev={};
let alertsArmed=false; setTimeout(()=>{alertsArmed=true;},10000);
function checkEvents(){
  const levels=(cfg.alert_levels||[]).slice().sort((a,b)=>a-b);
  for(const p of providers()){
    const s=p.snap, ws=workState(p.id);
    if(alertsArmed && ws==='attention' && workPrev[p.id] && workPrev[p.id]!=='attention')
      toast('!',AMBER,`${p.name} needs you`,'Waiting for your reply');
    workPrev[p.id]=ws;
    if(s.status!=='ok' || !levels.length) continue;
    const rows=[], grouped=s.groups&&s.groups.length;
    if(!grouped) for(const w of s.windows) if(w.count==null) rows.push({k:w.id||w.label,label:w.label,w});
    for(const g of (s.groups||[])) for(const w of g.rows) rows.push({k:g.account+'/'+(w.id||w.label),label:`${g.title} · ${g.account} · ${w.label}`,w});
    for(const r of rows){
      const key=p.id+':'+r.k, pct=Math.round(r.w.used*100);
      const lvl=levels.filter(l=>pct>=l).pop()||0, m=alertMemo[key];
      if(m && alertsArmed){
        if(lvl>m.lvl) toast('!',tone(r.w.used),`${p.name} ${pct}% used`,r.label+(r.w.resets_at?' · '+resetCopy(r.w.resets_at):''));
        else if(m.max>=50 && pct<10) toast('✓',AMPLE,p.id==='deepseek'?'DeepSeek topped up':`${p.name} quota reset`,r.label);
      }
      alertMemo[key]={lvl, max: pct<10 ? pct : Math.max(m?m.max:0,pct)};
    }
  }
}
let dsPrevPeak=null;
setInterval(()=>{
  updatePeek(); renderClosed();
  if(state==='open' && curTab!=='settings') renderPage(curTab);
  if(dsSnap.status==='absent') return;
  const {peak,next}=dsPricing();
  if(dsPrevPeak!==null && peak!==dsPrevPeak)
    toast(peak?'⏱':'☾', peak?'#FF8A3D':AMPLE, peak?'DeepSeek peak pricing started':'DeepSeek off-peak · 50% cheaper', (peak?'Off-peak again ':'Until ')+whenCopy(next));
  dsPrevPeak=peak;
},30000);

/* ---------- History ---------- */
const HIST_KEY='cn-hist-v1', HIST_MS=7*864e5, HIST_STEP=15*6e4;
let hist={};
try{ hist=JSON.parse(localStorage.getItem(HIST_KEY)||'{}')||{}; }catch{ hist={}; }
function recordHistory(){
  const now=Date.now(); let dirty=false;
  for(const p of providers()){
    const s=p.snap; if(s.status!=='ok') continue;
    const rows=[];
    if(!(s.groups&&s.groups.length)) for(const w of s.windows) if(w.count==null) rows.push([w.id||w.label,w]);
    for(const g of (s.groups||[])) for(const w of g.rows) rows.push([g.account+'/'+(w.id||w.label),w]);
    for(const [k,w] of rows){
      const key=p.id+':'+k, a=hist[key]||(hist[key]=[]), last=a[a.length-1], u=Math.round(w.used*1000)/1000;
      if(last && now-last[0]<HIST_STEP && Math.abs(last[1]-u)<0.01) continue;
      a.push([now,u]); dirty=true;
      while(a.length&&now-a[0][0]>HIST_MS) a.shift();
    }
  }
  if(dirty){ try{ localStorage.setItem(HIST_KEY,JSON.stringify(hist)); }catch{} }
}
function sinceReset(a){ let i=a.length-1; while(i>0 && a[i-1][1]<=a[i][1]+0.15) i--; return a.slice(i); }
function forecast(key,w){
  if(!w.resets_at) return null;
  const now=Date.now();
  const seg=sinceReset(hist[key]||[]).filter(p=>now-p[0]<6*36e5);
  if(seg.length<3) return null;
  const first=seg[0], last=seg[seg.length-1], dt=last[0]-first[0];
  if(dt<60*6e4) return null;
  const rate=(last[1]-first[1])/dt;
  if(rate<=1e-12) return {ok:true,text:'Barely moving lately — no risk of running out'};
  const eta=now+(1-Math.min(w.used,1))/rate;
  if(eta>=w.resets_at) return {ok:true,text:'At this pace it lasts until the reset'};
  return {ok:false,text:`At this pace it runs out ${whenCopy(eta)}`};
}
function spark(key){
  const now=Date.now(), a=(hist[key]||[]).filter(p=>now-p[0]<864e5);
  if(a.length<2 || a[a.length-1][0]-a[0][0]<36e5) return '';
  const W=300, H=24, t0=now-864e5;
  const pts=a.map(([t,u])=>`${((t-t0)/864e5*W).toFixed(1)},${(H-1-Math.min(u,1)*(H-2)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-opacity=".7" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`
    +`<div class="spark-l"><span>24h ago</span><span>now</span></div>`;
}
const tipsSeen=new Set();
function checkTips(){
  for(const p of providers()){
    if(!(p.snap.groups&&p.snap.groups.length)||p.snap.status!=='ok') continue;
    for(const t of accountTips(p.snap.groups)){
      if(tipsSeen.has(t.key)) continue;
      tipsSeen.add(t.key);
      if(alertsArmed) toast('↪',AMPLE,t.title,t.sub);
    }
  }
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return 'Resetting…';
  if(diff<60*60*1000) return `Resets in ${Math.max(1,Math.round(diff/60000))} min`;
  const d=new Date(ms), t=hm(ms);
  if(diff<24*60*60*1000) return `Resets at ${t}`;
  return `Resets ${d.toLocaleDateString('en-US',{weekday:'short'})} ${t}`;
}
function ago(ms){ const m=Math.round((Date.now()-ms)/60000); return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`; }
const STATE_DOT={running:RUNGREEN,attention:AMBER,done:'#57c7ff'};
const QUOTA_GLYPH={claude:'claude',codex:'codex',antigravity:'gemini',cursor:'cursor'};
function soonCopy(ms){
  if(!ms) return '';
  const m=Math.round((ms-Date.now())/60000);
  if(m<=0) return 'now';
  if(m<60) return `in ${m}m`;
  const h=Math.floor(m/60);
  return h<24 ? `in ${h}h ${m%60}m` : `in ${Math.floor(h/24)}d ${h%24}h`;
}
function accountTips(groups){
  const by={};
  for(const g of groups){
    if(!g.rows.length) continue;
    const left=Math.min(...g.rows.map(r=>1-r.used));
    (by[g.provider||g.title]=by[g.provider||g.title]||[]).push({g,left});
  }
  const tips=[];
  for(const list of Object.values(by)){
    if(list.length<2) continue;
    list.sort((a,b)=>a.left-b.left);
    const lo=list[0], hi=list[list.length-1];
    if(lo.left<0.2 && hi.left>=0.5) tips.push({
      key:lo.g.title+'|'+lo.g.account+'|'+hi.g.account,
      title:`${lo.g.title}: switch to ${hi.g.account}`,
      sub:`${lo.g.account} has ${Math.round(lo.left*100)}% left · ${hi.g.account} has ${Math.round(hi.left*100)}%`,
    });
  }
  return tips;
}
function renderGroups(groups){
  let h='<div class="q-groups">';
  for(const t of accountTips(groups)) h+=`<div class="q-tip">↪ <b>${esc(t.title)}</b><br>${esc(t.sub)}</div>`;
  for(const g of groups){
    const gid=QUOTA_GLYPH[g.provider];
    const icon=gid?glyphHtml({id:gid,name:g.title,glyph:''},true):'';
    h+=`<div class="q-group"><div class="q-head">${icon}<span class="q-title">${esc(g.title)}</span>`
      +`${g.plan?`<span class="q-plan">${esc(g.plan)}</span>`:''}<span class="q-acct">${esc(g.account)}</span></div>`;
    for(const r of g.rows){
      const left=Math.max(0,Math.min(100,Math.round((1-r.used)*100)));
      h+=`<div class="q-row" title="${esc(r.amount||'')}"><span class="q-name">${esc(r.label)}</span>`
        +`<span class="q-pct">${left}%</span><span class="q-reset">${soonCopy(r.resets_at)}</span>`
        +`<span class="q-bar"><i style="width:${left}%;background:${tone(r.used)}"></i></span></div>`;
    }
    if(g.message) h+=`<div class="q-msg">${esc(g.message)}</div>`;
    h+='</div>';
  }
  return h+'</div>';
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* ---------- Closed pill: the tightest quota and the next reset ---------- */
function worstAndNext(){
  const now=Date.now(); let worst=null, next=null;
  for(const p of providers()){
    if(p.snap.status==='needsAuth') continue;
    const h=headlineOf(p.snap);
    if(h&&h.count==null&&(!worst||h.used>worst.h.used)) worst={p,h};
    for(const w of p.snap.windows)
      if(w.count==null&&w.resets_at&&w.resets_at>now&&(!next||w.resets_at<next.w.resets_at)) next={p,w};
  }
  return {worst,next};
}
function renderClosed(){
  const {worst,next}=worstAndNext();
  const working=providers().some(p=>workState(p.id)==='running');
  let html;
  if(!worst) html=`<span class="c-dot"></span>`;
  else{
    const u=Math.min(worst.h.used,1), col=tone(u);
    const side=cfg.drag_enabled?false:(dockEdge()!=='top');
    html=`<span class="c-ring">${ring28(u,col)}${glyphHtml(worst.p,true)||esc(worst.p.glyph)}</span>`
      +`<span class="c-pct" style="color:${col}">${Math.round(u*100)}%</span>`
      +(side?'':'<span class="c-gap"></span>')
      +(working?'<span class="c-work" title="Working"></span>':'')
      +(next?`<span class="c-reset">↻ ${esc(soonCopy(next.w.resets_at).replace(/^in /,''))}</span>`:'');
  }
  if(closedEl.dataset.html!==html){ closedEl.innerHTML=html; closedEl.dataset.html=html; }
  if(dragging) $('dragpill').innerHTML=html.replace('c-gap','c-gap-x');
}

/* ---------- Panel: tabs and pages ---------- */
const TABS=['usage','detail','r9','settings'];
let curTab='usage', detailId=null;
function visibleTabs(){ return TABS.filter(t=>t!=='r9'||r9Snap.status!=='absent'); }
function setTab(t,animate=true){
  if(!visibleTabs().includes(t)) t='usage';
  curTab=t;
  const vis=visibleTabs();
  for(const b of $('tabs').querySelectorAll('button')){
    b.hidden=!vis.includes(b.dataset.tab);
    b.classList.toggle('on',b.dataset.tab===t);
  }
  const on=$('tabs').querySelector(`button[data-tab="${t}"]`);
  const ink=$('tabInk');
  if(on){ ink.style.width=on.offsetWidth+'px'; ink.style.transform=`translateX(${on.offsetLeft}px)`; }
  // every page stays in the track; hidden tabs just never get scrolled to
  const idx=TABS.indexOf(t);
  pagesEl.style.transform=`translateX(${-idx*100}%)`;
  renderPage(t,animate);
}
function renderPanel(animate){ setTab(curTab,animate); }
function renderPage(t,animate){
  const el=pagesEl.querySelector(`.page[data-page="${t}"]`); if(!el) return;
  const top=el.scrollTop;
  if(t==='usage') el.innerHTML=usageHtml();
  else if(t==='detail') el.innerHTML=detailHtml();
  else if(t==='r9') el.innerHTML=r9Html();
  else if(t==='settings') el.innerHTML=settingsHtml();
  el.scrollTop=top;
  if(animate){ el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
}

function tileRing(p){
  const h=headlineOf(p.snap);
  let inner=`<circle cx="28" cy="28" r="22" fill="var(--ink3)"/><circle cx="28" cy="28" r="25" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/>`;
  if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
  const ws=workState(p.id);
  if(ws==='running') inner+=`<g class="arc-spin">${svgArc(19,0.28,RUNGREEN,2.5)}</g>`;
  else if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/></g>`;
  return `<div class="ringwrap ${staleOf(p.snap)?'dim':''}"><svg class="ring" viewBox="0 0 56 56">${inner}</svg>`
    +`<div class="glyph ${(!glyphs[p.id]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>`;
}
function valueOf(p){
  const h=headlineOf(p.snap);
  if(p.snap.status==='needsAuth'||p.snap.status==='none') return '—';
  if(p.id==='deepseek' && shortMoney(p.snap.note)) return shortMoney(p.snap.note);
  if(h && h.count!=null) return '~'+h.count;
  if(h) return (h.derived?'~':'')+Math.round(h.used*100)+'%';
  return '…';
}
function subOf(p){
  const ws=workState(p.id);
  if(ws==='attention') return 'Needs you';
  if(ws==='running') return workDetail(p.id)||'Working';
  if(p.snap.status==='needsAuth') return 'Not connected';
  const h=headlineOf(p.snap);
  return h&&h.resets_at ? '↻ '+soonCopy(h.resets_at).replace(/^in /,'') : (h?h.label:''); // escaped by the caller
}
function usageHtml(){
  const ps=providers(), {worst,next}=worstAndNext();
  let s='<div class="sum">';
  if(worst) s+=`<span>Tightest <b style="color:${tone(worst.h.used)}">${esc(worst.p.name)} ${Math.round(worst.h.used*100)}%</b></span>`;
  if(next) s+=`<span>Next reset <b>${esc(next.p.name)} ${esc(soonCopy(next.w.resets_at))}</b></span>`;
  s+='</div><div class="tiles">';
  for(const p of ps){
    const h=headlineOf(p.snap), col=h&&h.count==null?tone(h.used):'var(--text)';
    s+=`<div class="tile" data-go="${p.id}">${tileRing(p)}<div class="t-name">${esc(p.name)}</div>`
      +`<div class="t-val" style="color:${p.snap.status==='needsAuth'?'var(--mute)':col}">${esc(valueOf(p))}</div><div class="t-sub">${esc(subOf(p))}</div></div>`;
  }
  return s+'</div>';
}
function detailHtml(){
  const ps=providers();
  const p=ps.find(x=>x.id===detailId)||ps[0];
  detailId=p.id;
  let chips='<div class="chips">';
  for(const q of ps){
    const h=headlineOf(q.snap);
    const icon=glyphHtml(q,true)||`<span class="cdot" style="background:${h&&h.count==null?tone(h.used):'var(--mute)'}"></span>`;
    chips+=`<div class="chip ${q.id===p.id?'on':''}" data-detail="${q.id}">${icon}${esc(q.name)}</div>`;
  }
  chips+='</div>';
  return chips+`<div class="d-card">${cardHtml(p)}</div>`;
}
function cardHtml(p){
  const snap=p.snap;
  const grouped=!!(snap.groups&&snap.groups.length);
  let html=`<div class="c-head">${glyphHtml(p,true)}<span class="c-title">${p.name}</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">Updated ${ago(snap.fetched_at)}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',gemini:'Sign in to Antigravity to see usage.',commandcode:'Add a Command Code API key to see usage.',router9:'Connect 9Router to see usage.',deepseek:'Add a DeepSeek API key to see your balance.'}[p.id]||'';
    html+=`<div class="c-note">${who}<br>${esc(snap.note||'')}</div>`;
    if(p.id==='commandcode'||p.id==='router9'||p.id==='deepseek')
      html+=`<div class="foot" style="margin-top:10px"><button class="btn acc" data-act="keys">Add API key…</button></div>`;
  }else if(p.id==='deepseek'){
    html+=renderDeepseek(snap);
  }else if(grouped){
    html+=`<div class="c-sub">Quota left per account</div>`+renderGroups(snap.groups);
    if(snap.note) html+=`<div class="c-note">${esc(snap.note)}</div>`;
    if(p.id==='router9') html+=`<div class="foot" style="margin-top:10px"><button class="btn" data-act="tab-r9">⏻ Manage connections</button></div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(snap.note||'Waiting for first reading…')}</div>`;
  }else{
    for(const w of snap.windows){
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(w.label)}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} request${w.count===1?'':'s'} today`:'no requests today'}</div></div>`;
        continue;
      }
      const hk=p.id+':'+(w.id||w.label), fc=forecast(hk,w);
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(w.label)}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${w.derived?'~':''}${Math.round(w.used*100)}% used</div>
        ${spark(hk)}
        ${fc?`<div class="w-fc" style="color:${fc.ok?'var(--mute)':WATCH}">${esc(fc.text)}</div>`:''}
      </div>`;
    }
    if(snap.note) html+=`<div class="c-note">${esc(snap.note)}</div>`;
  }
  if(p.id==='claude'){
    const act=(stateSnap.sessions||[]).filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,6))
        html+=`<div class="s-row s-jump" data-sid="${esc(s.id)}" title="Jump to this session"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span><span class="s-title">${esc(s.title)}</span><span class="s-go">↗</span></div>`;
      html+=`</div>`;
    }
  }else{
    const acts=activity.filter(a=>a.provider===p.id);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,5)){
        const col=a.state==='waiting'?AMBER:RUNGREEN;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="margin-left:auto">${esc(a.detail)}</span></div>`;
      }
      html+=`</div>`;
    }
  }
  return html;
}

/* 9Router: its accounts, and each connection's on/off switch (the dashboard's own switch) */
let conns=null, connsErr='', connsBusy=false;
function loadConns(){
  if(connsBusy) return;
  connsBusy=true;
  invoke('router9_connections').then(list=>{ conns=list||[]; connsErr=''; })
    .catch(e=>{ connsErr=String(e); })
    .finally(()=>{ connsBusy=false; if(state==='open'&&curTab==='r9') renderPage('r9'); });
}
function r9Html(){
  let h='';
  if(r9Snap.groups&&r9Snap.groups.length) h+=`<div class="sec"><h4>Quota left per account</h4>${renderGroups(r9Snap.groups)}</div>`;
  h+=`<div class="sec"><h4>Connections</h4>`;
  if(conns==null){ h+=`<div class="c-note">${connsErr?esc(connsErr):'Loading…'}</div>`; if(!connsErr) loadConns(); }
  else if(!conns.length) h+=`<div class="c-note">No connections in 9Router yet.</div>`;
  else{
    let group=null;
    for(const c of [...conns].sort((a,b)=>a.provider.localeCompare(b.provider))){
      if(c.provider!==group){ group=c.provider; h+=`<div class="conn-g">${esc(group)}</div>`; }
      h+=`<div class="row"><div class="rl">${esc(c.name||c.provider)}<div class="rs">${esc([c.auth_type,c.active?'on':'off'].filter(Boolean).join(' · '))}</div></div>`
        +`<button class="sw ${c.active?'on':''}" data-conn="${esc(c.id)}" title="On = 9Router may use this connection"></button></div>`;
    }
  }
  if(connsErr&&conns) h+=`<div class="q-msg">${esc(connsErr)}</div>`;
  h+=`<div class="foot" style="margin-top:8px"><button class="btn" data-act="conns-reload">Reload</button></div></div>`;
  return h;
}

function setPref(key,value){
  return invoke('set_pref',{key,value}).catch(e=>notice(String(e)));
}
panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-detail],[data-act],[data-set],[data-toggle],[data-theme-pick],[data-hide],[data-conn],[data-sid]');
  if(!t) return;
  const d=t.dataset;
  if(d.tab){ setTab(d.tab); return; }
  if(d.go){ detailId=d.go; setTab('detail'); return; }
  if(d.detail){ detailId=d.detail; renderPage('detail'); return; }
  if(d.sid){
    closeNotch();
    invoke('focus_session',{id:d.sid}).then(ok=>{ if(ok===false) toast('!',AMBER,'Couldn’t bring that session to the front','Its window may be closed or hidden in the tray'); }).catch(()=>{});
    return;
  }
  if(d.act==='keys'){ invoke('open_settings').catch(()=>{}); closeNotch(); return; }
  if(d.act==='refresh'){ invoke('refresh_usage').catch(()=>{}); toastSoon('↻','var(--accent)','Refreshing usage'); return; }
  if(d.act==='tab-r9'){ setTab('r9'); return; }
  if(d.act==='conns-reload'){ conns=null; connsErr=''; renderPage('r9'); return; }
  if(d.set){
    const v=JSON.parse(d.val);
    if(d.set==='pos'){ v==='free' ? setPref('free',true) : setPref('edge',v); }
    else if(d.set==='alerts') setPref('alert_levels', v===''?[]:String(v).split(',').map(Number));
    else setPref(d.set,v);
    return;
  }
  if(d.toggle){ t.classList.toggle('on'); setPref(d.toggle,t.classList.contains('on')); return; }
  if(d.themePick){ setPref('theme',d.themePick); return; }
  if(d.hide){
    const hid=new Set(cfg.hidden_providers||[]);
    hid.has(d.hide)?hid.delete(d.hide):hid.add(d.hide);
    setPref('hidden_providers',[...hid]);
    return;
  }
  if(d.conn){
    const c=(conns||[]).find(x=>x.id===d.conn); if(!c||t.disabled) return;
    const want=!c.active; t.disabled=true; t.classList.toggle('on',want);
    invoke('router9_set_active',{id:c.id,active:want})
      .then(()=>{ c.active=want; connsErr=''; })
      .catch(err=>{ connsErr=String(err); t.classList.toggle('on',!want); })
      .finally(()=>{ t.disabled=false; if(curTab==='r9') renderPage('r9'); });
  }
});
function toastSoon(icon,color,title){ /* feedback while open: a short notice line */ notice(title); }

/* Horizontal swipe (trackpad) or Shift+wheel over the pages moves between tabs */
let swipeAcc=0, swipeT=null;
$('pagesWrap').addEventListener('wheel',e=>{
  const dx=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);
  if(!dx) return;
  e.preventDefault();
  swipeAcc+=dx; clearTimeout(swipeT); swipeT=setTimeout(()=>swipeAcc=0,220);
  if(Math.abs(swipeAcc)>60){
    const vis=visibleTabs(), i=vis.indexOf(curTab);
    const n=Math.max(0,Math.min(vis.length-1,i+(swipeAcc>0?1:-1)));
    swipeAcc=0; if(vis[n]!==curTab) setTab(vis[n]);
  }
},{passive:false});

  checkEvents();
  checkTips();
  recordHistory();
  updatePeek();
  renderClosed();
  // re-renders the current page too; the 9Router tab appears and disappears with 9Router
  if(state==='open') setTab(curTab,false);
}

/* ---------- Diagnostics + geometry ---------- */
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;}); }
function physRect(r){const k=window.devicePixelRatio||1;return [r.left*k,r.top*k,(r.right-r.left)*k,(r.bottom-r.top)*k];}
// Open, the whole window is the island: report it so the Rust watchdog can tell when the cursor has left
function armWatchdog(){
  setTimeout(()=>{ if(state==='open') callq('set_expanded',{on:true,rects:[physRect({left:0,top:0,right:innerWidth,bottom:innerHeight})]}).catch(()=>{}); },OPEN_WAIT);
}
const OPEN_WAIT=120;
/* Design width for the current mode, mirroring notch_size() in main.rs. Deliberately unscaled:
   the leftover mismatch measured here is the size setting (or a DPI mismatch), which fitZoom
   turns into content zoom. */
function designWidth(){
  if(dragging) return GEO.drag[0];
  const open=state==='open';
  const pick=(o,c)=> open?o : peekWin===2?GEO.toast[0] : peekWin===1?GEO.live[0] : c;
  if(cfg.drag_enabled) return pick(GEO.openTop[0],GEO.pill[0]);
  if(dockEdge()==='top') return pick(GEO.openTop[0],GEO.pill[0])+2*GEO.fil; // plus the two fillets
  return open?GEO.openSide[0] : peekWin===2?GEO.toast[0] : peekWin===1?GEO.live[0] : GEO.side[0];
}
function fitZoom(){
  const z=Math.min(3,Math.max(0.4,innerWidth/designWidth()));
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)} state=${state}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr(); if(state==='open'){ armWatchdog(); setTab(curTab,false);} },120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* ---------- Hover ----------
   Closed: the pill (or the Live Activity / alert) is the hot area, with a short dwell so sweeping past
   the edge does not fling the island open. Open: the whole window is the island; leaving it closes. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function pointerInHot(x,y){
  if(state==='open') return x>=0&&y>=0&&x<innerWidth&&y<innerHeight;
  const el = (root.dataset.peek==='1'||root.dataset.peek==='2') ? live : closedEl;
  return inRect(x,y,el.getBoundingClientRect(),6);
}
let hideTimer=null, dwellTimer=null;
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(closeNotch,260);}
document.addEventListener('mousemove',e=>{
  if(dragging) return;
  if(pointerInHot(e.clientX,e.clientY)){
    clearTimeout(hideTimer);
    if(state!=='open'){
      if(needLeave){ if(Date.now()<reopenAfter) return; needLeave=false; }
      if(!dwellTimer) dwellTimer=setTimeout(()=>{dwellTimer=null;openNotch();},180);
    }
  }else{
    clearTimeout(dwellTimer); dwellTimer=null; needLeave=false;
    if(state==='open') scheduleHide();
  }
});
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget){ clearTimeout(dwellTimer); dwellTimer=null; if(state==='open') scheduleHide(); } });
listen('pointer_left',()=>{clearTimeout(hideTimer);closeNotch();}).catch(()=>{});

/* ---------- Drag ----------
   Press and move more than 4 px: the island lifts off as a plain pill that follows the cursor (Rust
   moves the window), and on release it glides to the nearest of the three spots — the middle of the
   top, left or right edge — settling with a small bounce. A press without movement opens it. Open,
   the tab bar is the grip, so every button and switch below it stays a button. */
function beginPress(e){
  if(e.button!==0) return;
  if(state==='open' && e.target.closest('button')) return;
  press={x:e.clientX,y:e.clientY};
}
closedEl.addEventListener('mousedown',beginPress);
live.addEventListener('mousedown',beginPress);
$('tabs').addEventListener('mousedown',beginPress);
document.addEventListener('mousemove',e=>{
  if(!press||dragging) return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true;
    clearTimeout(hideTimer); clearTimeout(dwellTimer); dwellTimer=null; clearTimeout(pendingShrink);
    if(state==='open'){ state='idle'; root.dataset.state='idle'; invoke('set_expanded',{on:false,rects:null}).catch(()=>{}); }
    renderClosed();
    $('dragpill').innerHTML=closedEl.innerHTML;
    root.dataset.drag='1';
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;root.dataset.drag='0';});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0) return;
  if(press&&!dragging&&state!=='open') openNotch();
  press=null;
});
listen('drag_end',()=>{
  dragging=false; press=null;
  root.dataset.drag='0';
  setTimeout(pumpToasts,400);
}).catch(()=>{});

function notice(msg){
  const n=$('notice');
  n.textContent=String(msg||'');n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),4000);
}

/* ---------- Data ---------- */
const onSnap=(setter)=>e=>{ setter(e.payload); renderAll(); };
listen('usage',onSnap(p=>usage=p||usage)).catch(e=>notice('listen(usage) failed: '+e));
listen('state',onSnap(p=>stateSnap=p||stateSnap)).catch(()=>{});
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',onSnap(p=>codexSnap=p||codexSnap)).catch(()=>{});
listen('cursor',onSnap(p=>cursorSnap=p||cursorSnap)).catch(()=>{});
listen('antigravity',onSnap(p=>agSnap=p||agSnap)).catch(()=>{});
listen('commandcode',onSnap(p=>ccSnap=p||ccSnap)).catch(()=>{});
listen('router9',onSnap(p=>{ r9Snap=p||r9Snap; })).catch(()=>{});
listen('deepseek',onSnap(p=>dsSnap=p||dsSnap)).catch(()=>{});
listen('glyphs',onSnap(p=>glyphs=p||glyphs)).catch(()=>{});
listen('activity',onSnap(p=>activity=p||activity)).catch(()=>{});
const get=(cmd,setter)=>invoke(cmd).then(v=>{ setter(v); renderAll(); }).catch(()=>{});
get('get_usage',v=>usage=v||usage); get('get_codex',v=>codexSnap=v||codexSnap); get('get_cursor',v=>cursorSnap=v||cursorSnap);
get('get_antigravity',v=>agSnap=v||agSnap); get('get_commandcode',v=>ccSnap=v||ccSnap); get('get_router9',v=>r9Snap=v||r9Snap);
get('get_deepseek',v=>dsSnap=v||dsSnap); get('get_state',v=>stateSnap=v||stateSnap); get('get_activity',v=>activity=v||activity);
get('get_glyphs',v=>glyphs=v||glyphs);

function applyCfg(){
  root.style.opacity = (cfg.opacity!=null?cfg.opacity:1);
  root.dataset.edge = cfg.drag_enabled ? 'top' : dockEdge();
  root.dataset.mode = cfg.drag_enabled?'free':'dock';
  root.dataset.theme = (!cfg.theme||cfg.theme==='dark') ? 'midnight' : cfg.theme;
  closedEl.dataset.html='';
  fitZoom();
  renderAll();
  if(state==='open') renderPage('settings'); // a setting changed from the Settings tab: reflect it
}
listen('config',e=>{cfg=e.payload||cfg;applyCfg();}).catch(()=>{});
invoke('get_config').then(c=>{cfg=c||cfg;applyCfg();}).catch(()=>{});
</script>
