<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows.
     Motion: the notch rests as a slim handle and grows out of it on approach (AssistiveTouch), so the
     desktop is not covered by a permanent panel. Everything that moves is transform/opacity only —
     a transparent always-on-top window repaints through the desktop compositor, and animating layout
     properties there stutters every other app on screen. */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #root{
    position:relative;width:100%;height:100%;
    /* Overshoot on the way out, settle on the way back: the difference is what reads as liquid rather than mechanical */
    --spring:cubic-bezier(.34,1.8,.5,1);
    --ease:cubic-bezier(.22,1,.36,1);
    --ink:#000;--stroke:#2e2e2e;
  }

  /* ---------- The resting handle ---------- */
  #handle{
    position:absolute;background:rgba(230,230,235,.34);
    border-radius:99px;pointer-events:auto;cursor:pointer;
    transition:opacity .22s var(--ease),transform .34s var(--spring),background .3s linear;
    box-shadow:0 0 10px rgba(0,0,0,.35);
  }
  /* Every docked rule is scoped to data-mode="dock": free mode keeps its own data-edge (the edge it
     would snap back to), so unscoped edge rules would leave e.g. right:0 set alongside left:50% and
     stretch the island across the window instead of centring it. */
  #root[data-mode="dock"][data-edge="right"] #handle{right:3px;top:50%;width:5px;height:104px;transform:translateY(-50%)}
  #root[data-mode="dock"][data-edge="left"]  #handle{left:3px;top:50%;width:5px;height:104px;transform:translateY(-50%)}
  #root[data-mode="dock"][data-edge="top"]   #handle{top:3px;left:50%;height:5px;width:104px;transform:translateX(-50%)}
  #root[data-mode="dock"][data-edge="bottom"]#handle{bottom:3px;left:50%;height:5px;width:104px;transform:translateX(-50%)}
  #root[data-mode="free"]  #handle{left:50%;top:50%;height:6px;width:104px;transform:translate(-50%,-50%)}
  /* Opening: the handle stretches along its axis and dissolves into the pill growing over it */
  #root[data-state="open"] #handle{opacity:0;pointer-events:none}
  #root[data-state="open"][data-mode="dock"][data-edge="right"] #handle,
  #root[data-state="open"][data-mode="dock"][data-edge="left"]  #handle{transform:translateY(-50%) scaleY(1.5)}
  #root[data-state="open"][data-mode="dock"][data-edge="top"] #handle,
  #root[data-state="open"][data-mode="dock"][data-edge="bottom"] #handle{transform:translateX(-50%) scaleX(1.5)}
  #root[data-state="open"][data-mode="free"] #handle{transform:translate(-50%,-50%) scaleX(1.5)}

  /* ---------- The pill ---------- */
  #pill{
    position:absolute;background:var(--ink);
    border:1px solid var(--stroke);
    display:flex;align-items:center;cursor:pointer;
    opacity:0;pointer-events:none;
    /* Grows out of the edge it is docked to, so the handle appears to swell into it */
    transition:opacity .2s var(--ease),transform .42s var(--spring);
  }
  #root[data-state="open"] #pill{opacity:1;pointer-events:auto}
  /* Side edges: a vertical column welded to the screen edge */
  #root[data-mode="dock"][data-edge="right"] #pill{
    right:0;top:50%;width:70px;padding:18px 0;flex-direction:column;gap:14px;
    border-radius:20px 0 0 20px;border-right:none;
    transform-origin:right center;transform:translateY(-50%) scale(.28);
  }
  #root[data-mode="dock"][data-edge="left"] #pill{
    left:0;top:50%;width:70px;padding:18px 0;flex-direction:column;gap:14px;
    border-radius:0 20px 20px 0;border-left:none;
    transform-origin:left center;transform:translateY(-50%) scale(.28);
  }
  #root[data-state="open"][data-mode="dock"][data-edge="right"] #pill,
  #root[data-state="open"][data-mode="dock"][data-edge="left"]  #pill{transform:translateY(-50%) scale(1)}
  /* Top/bottom edges and free float: a Dynamic Island — one row, fully rounded, detached from the edge.
     It hangs from the top of its own window so the card always has the room underneath it. */
  #root[data-mode="dock"][data-edge="top"] #pill{
    top:16px;left:50%;padding:12px 20px;flex-direction:row;gap:18px;border-radius:26px;
    transform-origin:center top;transform:translateX(-50%) scale(.28);
  }
  #root[data-mode="dock"][data-edge="bottom"] #pill{
    bottom:16px;left:50%;padding:12px 20px;flex-direction:row;gap:18px;border-radius:26px;
    transform-origin:center bottom;transform:translateX(-50%) scale(.28);
  }
  #root[data-state="open"][data-mode="dock"][data-edge="top"] #pill,
  #root[data-state="open"][data-mode="dock"][data-edge="bottom"] #pill{transform:translateX(-50%) scale(1)}
  #root[data-mode="free"] #pill{
    left:50%;top:16px;right:auto;bottom:auto;padding:12px 20px;flex-direction:row;gap:18px;border-radius:26px;
    transform-origin:center top;transform:translateX(-50%) scale(.28);
  }
  #root[data-state="open"][data-mode="free"] #pill{transform:translateX(-50%) scale(1)}

  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. Side
     edges only — an island floats clear of the edge and has nothing to blend into. */
  #pill::before,#pill::after{content:"";position:absolute;width:var(--fillet);height:var(--fillet);pointer-events:none;display:none}
  #pill{--fillet:26px}
  #root[data-mode="dock"][data-edge="right"] #pill::before,#root[data-mode="dock"][data-edge="right"] #pill::after,
  #root[data-mode="dock"][data-edge="left"]  #pill::before,#root[data-mode="dock"][data-edge="left"]  #pill::after{display:block}
  #root[data-edge="right"] #pill::before{
    right:0;top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--stroke) calc(var(--fillet) - 0.5px), var(--ink) calc(var(--fillet) + 0.5px));
  }
  #root[data-edge="right"] #pill::after{
    right:0;bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--stroke) calc(var(--fillet) - 0.5px), var(--ink) calc(var(--fillet) + 0.5px));
  }
  #root[data-edge="left"] #pill::before{
    left:0;top:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--stroke) calc(var(--fillet) - 0.5px), var(--ink) calc(var(--fillet) + 0.5px));
  }
  #root[data-edge="left"] #pill::after{
    left:0;bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--stroke) calc(var(--fillet) - 0.5px), var(--ink) calc(var(--fillet) + 0.5px));
  }

  /* ---------- Dragging: the notch travels as a drop of ink ----------
     The edge-welded pill (fillets and all) looked like a cut-out sticker once pulled off its edge, so
     while dragged everything else is hidden and a round drop takes its place: it stretches along the
     direction of travel, its outline ripples through a turbulence displacement that grows with speed,
     and on release it flattens against the edge it lands on before the handle takes over. The filter
     only runs while dragging — nothing references it otherwise. */
  #blob{
    position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #3b3b42 0%, #121214 46%, #000 74%);
    box-shadow:0 0 0 1px var(--stroke), 0 10px 24px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transform:scale(.3);
    transition:opacity .16s linear, transform .4s var(--spring);
  }
  #blob .rim{position:absolute;inset:4px;border-radius:50%;border:2px solid var(--tint,#00FF88);opacity:.85}
  #blob .shine{position:absolute;left:15px;top:11px;width:15px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(1px)}
  #root[data-drag="1"] #blob{
    opacity:1;filter:url(#liquid);
    /* rotate · stretch · rotate back: a stretch along the direction of travel, whatever it is */
    transform:rotate(var(--ang,0rad)) scale(calc(1 + var(--st,0)), calc(1 - var(--st,0) * .55)) rotate(calc(var(--ang,0rad) * -1));
    transition:opacity .16s linear, transform .14s linear;
  }
  #root[data-drag="1"] #pill,#root[data-drag="1"] #handle,#root[data-drag="1"] #card{opacity:0!important;pointer-events:none!important;transition:opacity .08s linear}
  /* Landing: the drop flattens against the edge it is gliding onto */
  #root[data-drag="1"][data-land] #blob{transition:opacity .16s linear, transform .24s var(--ease)}
  #root[data-drag="1"][data-land="right"]  #blob{transform-origin:100% 50%;transform:scale(.4,1.4)}
  #root[data-drag="1"][data-land="left"]   #blob{transform-origin:0 50%;transform:scale(.4,1.4)}
  #root[data-drag="1"][data-land="top"]    #blob{transform-origin:50% 0;transform:scale(1.4,.4)}
  #root[data-drag="1"][data-land="bottom"] #blob{transform-origin:50% 100%;transform:scale(1.4,.4)}
  #root[data-drag="1"][data-land="free"]   #blob{transform:scale(1.7,.28)}
  #root[data-land=""] #blob{transform-origin:50% 50%}

  /* ---------- Cells ---------- */
  .cell{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:0;transform:scale(.55);
    transition:opacity .18s linear,transform .4s var(--spring);
  }
  /* Staggered so the row/column unfurls instead of appearing all at once */
  #root[data-state="open"] .cell{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 34ms)}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:#e8e8ea}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:26px;height:26px;object-fit:contain}
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  .ringwrap,.glyph{transition:opacity .25s linear}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}

  /* ---------- Hover card ---------- */
  #card{
    position:absolute;width:246px;max-width:calc(100% - 20px);--tail:50%;
    background:#0a0a0a;border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    opacity:0;pointer-events:none;transform:scale(.9);
    transition:opacity .16s linear,transform .34s var(--spring);
  }
  #card.show{opacity:1;pointer-events:auto;transform:none}
  #card::after{content:"";position:absolute;border:8px solid transparent}
  /* The tail points back at the pill, on whichever side the card had to open */
  #card.tail-r::after{right:-8px;top:var(--tail);transform:translateY(-50%);border-right:none;border-left:10px solid #0a0a0a}
  #card.tail-l::after{left:-8px;top:var(--tail);transform:translateY(-50%);border-left:none;border-right:10px solid #0a0a0a}
  #card.tail-t::after{top:-8px;left:var(--tail);transform:translateX(-50%);border-top:none;border-bottom:10px solid #0a0a0a}
  #card.tail-b::after{bottom:-8px;left:var(--tail);transform:translateX(-50%);border-bottom:none;border-top:10px solid #0a0a0a}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px;transition:width .5s var(--ease)}
  .w-used{font-size:11px;color:#808080}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  /* Quota Tracker layout (9Router, several Command Code accounts): a block per account, a compact row
     per quota. Several accounts outgrow any window, so this card scrolls — the wheel reaches an
     unfocused window on Windows 10+. */
  #card.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
  #card.scroll::-webkit-scrollbar{width:6px}
  #card.scroll::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
  .q-group{margin-top:12px;padding-top:10px;border-top:1px solid #1c1c1c}
  .q-group:first-child{margin-top:8px;border-top:none;padding-top:0}
  .q-head{display:flex;align-items:center;gap:6px;min-width:0}
  .q-head .mark{display:inline-flex;width:14px;height:14px;color:#e8e8ea;flex:0 0 auto}
  .q-head .mark svg{width:14px;height:14px;fill:currentColor}
  .q-head img{width:14px!important;height:14px!important;border-radius:3px;flex:0 0 auto}
  .q-title{font-size:12.5px;font-weight:700;white-space:nowrap}
  .q-plan{font-size:10px;color:#8a8a93;background:#1a1a1e;border-radius:99px;padding:1px 6px;white-space:nowrap}
  .q-acct{font-size:11px;color:#808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;min-width:0}
  .q-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;align-items:baseline;margin-top:7px;font-size:11px}
  .q-name{color:#e8e8ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-pct{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  .q-reset{color:#808080;font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .q-bar{grid-column:1/-1;height:3px;border-radius:2px;background:#2d2d2d;overflow:hidden;margin-top:4px}
  .q-bar i{display:block;height:100%;border-radius:2px;transition:width .5s var(--ease)}
  .q-msg{font-size:11px;color:#c8a24a;margin-top:6px;line-height:1.4}
  #notice{
    position:absolute;left:8px;bottom:6px;right:80px;font-size:10px;color:#808080;
    background:rgba(0,0,0,.85);border-radius:8px;padding:4px 8px;display:none
  }
  #notice.show{display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- The drop's ripple: animated fractal noise displacing its outline; the scale is raised with speed -->
  <filter id="liquid" x="-40%" y="-40%" width="180%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="noise">
      <animate attributeName="baseFrequency" dur="1.4s" values="0.018;0.034;0.018" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap id="liquidDisp" in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="root" data-edge="right" data-mode="dock" data-state="idle">
  <div id="card"></div>
  <div id="handle"></div><!-- the resting state: a slim capsule at the edge, like the iOS home indicator -->
  <div id="pill"></div><!-- one .cell per provider (column on a side edge, row as an island) -->
  <div id="blob"><div class="rim"></div><div class="shine"></div></div><!-- what is carried while dragging -->
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const TRACK='#303030', AMBER='#FFBF00', RUNGREEN='#28E07B';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
let ccSnap={status:'absent',windows:[],fetched_at:0,note:''};
let r9Snap={status:'absent',windows:[],fetched_at:0,note:''};
let cfg={opacity:1,scale:1,edge:'right',drag_enabled:false};
let glyphs={}; // id → {kind:'mark'|'appicon', url}
let activity=[]; // working state of the non-Claude providers: {provider,state:'busy'|'waiting',name,detail,since}

const root=document.getElementById('root'), card=document.getElementById('card');
const pill=document.getElementById('pill'), handle=document.getElementById('handle');
const blob=document.getElementById('blob'), liquidDisp=document.getElementById('liquidDisp');

/* ---------- Open / closed ----------
   The window itself resizes with the state (Rust side): an always-on-top window eats clicks over its
   whole rectangle, so a notch that is "hidden" but still 340 px wide would quietly block the desktop.
   Closed it is only the handle; opening grows the window first, then the pill springs out into it. */
const OPEN_MS=420, CLOSE_MS=240;
const BALL=84; // mirrors main.rs BALL: the window's logical side while dragging
let state='idle', pendingShrink=null;
// Declared up here, not beside the drag code: designWidth() reads it during the very first reportDpr(),
// and a `let` further down is still in its temporal dead zone then — the read throws and the script dies.
let press=null, dragging=false;
function isIsland(){ return cfg.drag_enabled || cfg.edge==='top' || cfg.edge==='bottom'; }
function openNotch(){
  clearTimeout(pendingShrink); clearTimeout(dwellTimer);
  if(state==='open') return;
  state='open';
  // Set the state synchronously rather than waiting on the resize or a frame callback: this window is
  // WS_EX_NOACTIVATE and never focused, and requestAnimationFrame in a never-focused overlay is not
  // reliably scheduled — deferring the class to one left the pill invisible with the window already open.
  root.dataset.state='open';
  renderRing();
  invoke('notch_expand',{on:true}).catch(e=>notice('notch_expand failed: '+e));
}
function closeNotch(){
  clearTimeout(dwellTimer);
  if(state==='idle') return;
  state='idle';
  hideCard();
  root.dataset.state='idle';
  // Let the pill shrink away before the window does, or the last frames get clipped mid-animation
  clearTimeout(pendingShrink);
  pendingShrink=setTimeout(()=>invoke('notch_expand',{on:false}).catch(()=>{}),CLOSE_MS);
}

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}
// Provider table (order = top to bottom in the pill). `glyph` is the fallback letter used when no mark is available
function providers(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(ccSnap.status!=='absent') list.push({id:'commandcode',name:'Command Code',glyph:'Cc',snap:ccSnap});
  if(r9Snap.status!=='absent') list.push({id:'router9',name:'9Router',glyph:'9r',snap:r9Snap});
  return list;
}
function headlineOf(snap){
  if(!snap.windows.length) return null;
  const metered=snap.windows.filter(w=>w.count==null);
  if(metered.length) return metered.reduce((a,b)=> b.used>a.used?b:a);
  return snap.windows[0];
}
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>5*60*1000; }
let stateSnap={sessions:[],agg:'idle'};

function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="butt"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

/* The handle carries the one number that matters while closed: it takes the colour of the most
   constrained provider, so a glance at the edge still says "you are fine" or "you are nearly out". */
let worstTone=null;
function tintHandle(){
  let worst=null;
  for(const p of providers()){
    const h=headlineOf(p.snap);
    if(h&&h.count==null&&(worst==null||h.used>worst)) worst=h.used;
  }
  const anyWorking=providers().some(p=>workState(p.id)==='running');
  worstTone = worst==null ? null : tone(worst);
  handle.style.background = worstTone || 'rgba(230,230,235,.34)';
  handle.style.opacity = state==='open' ? '' : (anyWorking?'.95':'.62');
}

function renderRing(){
  const ps=providers();
  tintHandle();
  if(state!=='open') return; // nothing of the pill is on screen while closed; skip the DOM work entirely
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor)
  const want=ps.map(p=>p.id+':'+(glyphs[p.id]?glyphs[p.id].kind:'-')).join(',');
  if(pill.dataset.cells!==want){
    pill.innerHTML=ps.map((p,i)=>`<div class="cell" data-p="${p.id}" style="--i:${i}">
      <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"></svg><div class="glyph ${(!glyphs[p.id]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>
      <div class="pct">—</div></div>`).join('');
    pill.dataset.cells=want;
  }
  for(const p of ps){
    const cell=pill.querySelector(`.cell[data-p="${p.id}"]`); if(!cell) continue;
    const svg=cell.querySelector('svg.ring'), pct=cell.querySelector('.pct'), glyph=cell.querySelector('.glyph'), wrap=cell.querySelector('.ringwrap');
    const h=headlineOf(p.snap);
    let inner=`<circle cx="28" cy="28" r="22" fill="#2a2a2a"/><circle cx="28" cy="28" r="25" fill="none" stroke="${TRACK}" stroke-width="5"/>`;
    if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
    { // thin inner arc: spinning = working, amber pulse = waiting on you (one animation for all four, different sources)
      const ws=workState(p.id);
      if(ws==='running') inner+=`<g class="arc-spin">${svgArc(19,0.28,RUNGREEN,2.5)}</g>`;
      else if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/></g>`;
    }
    svg.innerHTML=inner;
    if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+h.count;
    else if(h) pct.textContent=(h.derived?'~':'')+Math.round(h.used*100)+'%';
    else pct.textContent='…';
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('dim', staleOf(p.snap));
  }
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return 'Resetting…';
  if(diff<60*60*1000) return `Resets in ${Math.max(1,Math.round(diff/60000))} min`;
  const d=new Date(ms);
  const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(diff<24*60*60*1000) return `Resets at ${t}`;
  return `Resets ${d.toLocaleDateString('en-US',{weekday:'short'})} ${t}`;
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`;
}

const STATE_DOT={running:RUNGREEN,attention:AMBER,done:'#57c7ff'};

/* Per-account card (9Router, several Command Code accounts): one block per account, rows as the
   dashboard shows them — the share *left*, a bar of the same length, and the countdown. The ring
   keeps the notch's own convention (share *used*), which is why the card says "left" out loud. */
const QUOTA_GLYPH={claude:'claude',codex:'codex',antigravity:'gemini',cursor:'cursor'};
function soonCopy(ms){
  if(!ms) return '';
  const m=Math.round((ms-Date.now())/60000);
  if(m<=0) return 'now';
  if(m<60) return `in ${m}m`;
  const h=Math.floor(m/60);
  return h<24 ? `in ${h}h ${m%60}m` : `in ${Math.floor(h/24)}d ${h%24}h`;
}
function renderGroups(groups){
  let h='<div class="q-groups">';
  for(const g of groups){
    const gid=QUOTA_GLYPH[g.provider];
    const icon=gid?glyphHtml({id:gid,name:g.title,glyph:''},true):'';
    h+=`<div class="q-group"><div class="q-head">${icon}<span class="q-title">${esc(g.title)}</span>`
      +`${g.plan?`<span class="q-plan">${esc(g.plan)}</span>`:''}<span class="q-acct">${esc(g.account)}</span></div>`;
    for(const r of g.rows){
      const left=Math.max(0,Math.min(100,Math.round((1-r.used)*100)));
      h+=`<div class="q-row" title="${esc(r.amount||'')}"><span class="q-name">${esc(r.label)}</span>`
        +`<span class="q-pct">${left}%</span><span class="q-reset">${soonCopy(r.resets_at)}</span>`
        +`<span class="q-bar"><i style="width:${left}%;background:${tone(r.used)}"></i></span></div>`;
    }
    if(g.message) h+=`<div class="q-msg">${esc(g.message)}</div>`;
    h+='</div>';
  }
  return h+'</div>';
}

let hoverId='claude';
function renderCard(){
  const c=card;
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const grouped=!!(snap.groups&&snap.groups.length);
  c.classList.toggle('scroll', grouped);
  const headIcon=glyphHtml(p,true);
  let html=`<div class="c-head">${headIcon}<span class="c-title">${p.name} Usage</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">Updated ${ago(snap.fetched_at)}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',gemini:'Sign in to Antigravity to see usage.',commandcode:'Add a Command Code API key to see usage.',router9:'Connect 9Router to see usage.'}[p.id]||'';
    html+=`<div class="c-note">${who}<br>${esc(snap.note||'')}</div>`;
    // The notch cannot take keyboard focus, so the key is typed in the API-keys window instead
    if(p.id==='commandcode'||p.id==='router9')
      html+=`<button onclick="invoke('open_settings')" style="margin-top:10px;font:600 12px 'Segoe UI',system-ui,sans-serif;background:#ececf0;color:#0b0b0d;border:0;border-radius:8px;padding:7px 12px;cursor:pointer">Add API key…</button>`;
  }else if(grouped){
    html+=`<div class="c-sub">Quota left per account</div>`;
    html+=renderGroups(snap.groups);
    if(snap.note) html+=`<div class="c-note">${esc(snap.note)}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(snap.note||'Waiting for first reading…')}</div>`;
  }else{
    for(const w of snap.windows){
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(w.label)}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} request${w.count===1?'':'s'} today`:'no requests today'}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(w.label)}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${w.derived?'~':''}${Math.round(w.used*100)}% Used</div>
      </div>`;
    }
    if(snap.note) html+=`<div class="c-note">${esc(snap.note)}</div>`;
  }
  if(p.id==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,5)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    const acts=activity.filter(a=>a.provider===p.id);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,5)){
        const col=a.state==='waiting'?AMBER:RUNGREEN;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(a.detail)}</span></div>`;
      }
      html+=`</div>`;
    }
  }
  c.innerHTML=html;
  placeCard();
}
/* The card opens on the free side of the pill and its tail points back at the hovered cell:
   beside it on a side edge, under/over it in island form. */
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect(), pr=pill.getBoundingClientRect();
  const W=innerWidth, H=innerHeight, cw=card.offsetWidth||246, ch=card.offsetHeight||0;
  card.classList.remove('tail-r','tail-l','tail-t','tail-b');
  if(isIsland()||cfg.edge==='top'||cfg.edge==='bottom'){
    const below = cfg.edge!=='bottom';
    const cx=cr.left+cr.width/2;
    let left=Math.round(cx-cw/2); left=Math.max(8,Math.min(left,W-cw-8));
    let top = below ? Math.round(pr.bottom+10) : Math.round(pr.top-ch-10);
    top=Math.max(8,Math.min(top,H-ch-8));
    card.style.left=left+'px'; card.style.top=top+'px';
    card.classList.add(below?'tail-t':'tail-b');
    card.style.setProperty('--tail',Math.max(16,Math.min(cw-16,Math.round(cx-left)))+'px');
  }else{
    const onLeft = cfg.edge!=='left'; // docked right → card opens to the left, and vice versa
    const cy=cr.top+cr.height/2;
    let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
    card.style.top=top+'px';
    card.style.left = onLeft ? Math.max(8,Math.round(pr.left-cw-12))+'px' : Math.round(pr.right+12)+'px';
    card.classList.add(onLeft?'tail-r':'tail-l');
    card.style.setProperty('--tail',Math.max(16,Math.min(ch-16,Math.round(cy-top)))+'px');
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
let hideTimer=null, dwellTimer=null;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();} // show first, then render: placeCard needs offsetHeight
function hideCard(){card.classList.remove('show');invoke('set_expanded',{on:false,rects:null}).catch(()=>{});}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(()=>{hideCard();closeNotch();},250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
function armWatchdog(){
  requestAnimationFrame(()=>{ // wait one frame so renderCard's new content is laid out before measuring
    if(!card.classList.contains('show'))return;
    callq('set_expanded',{on:true,rects:[rectOf(pill),rectOf(card)]}).catch(()=>{});
  });
}
/* Design width for the current mode, mirroring the Rust constants (NOTCH_W / ISLAND_W / HANDLE_* / BALL).
   Deliberately *unscaled*: the window is sized scale× larger on the Rust side, so the leftover
   mismatch measured here is exactly the user's size setting and fitZoom turns it into content zoom. */
function designWidth(){
  if(dragging) return BALL;
  if(state!=='open') return isIsland()?132:18;
  return isIsland()?560:340;
}
// Viewport fit (pure front-end fallback, independent of Rust): if this page's CSS viewport is not the
// design width, the WebView's DPR disagrees with the monitor (or the user picked a size); CSS zoom pulls the layout back.
function fitZoom(){
  // Clamped: designWidth() depends on the mode, and the mode arrives with the config a moment after
  // load. An unclamped ratio turned a 132 px island handle measured against the 18 px docked handle
  // into a 7.3× zoom that wrecked the whole layout. A real DPI mismatch or size setting is never
  // anywhere near this far out, so clamping costs nothing and makes the transient harmless.
  const z=Math.min(3,Math.max(0.4,innerWidth/designWidth()));
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)} state=${state}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();if(card.classList.contains('show'))armWatchdog();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  if(state!=='open') return inRect(x,y,handle.getBoundingClientRect(),8);
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,6))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    if(state!=='open'){
      // A short dwell before opening, so sweeping the cursor past the edge does not fling the panel open
      if(!dwellTimer) dwellTimer=setTimeout(()=>{dwellTimer=null;openNotch();},200);
      return;
    }
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else{
    clearTimeout(dwellTimer); dwellTimer=null;
    if(state==='open'){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
  }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget){ clearTimeout(dwellTimer); dwellTimer=null; if(state==='open'){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); } }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();closeNotch();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});

/* ---------- Drag ----------
   Press and move more than 4 px = drag. The notch is picked up as a drop: the card and pill go, the
   window shrinks to the ball (Rust), and Rust follows the system cursor, streaming its velocity here
   so the drop stretches along its path and ripples harder the faster it moves. On release it glides
   to the nearest edge (or stays put in island mode), flattens against it, and the handle returns.
   A press without movement opens the notch (closed) or the provider's usage page (open). */
function beginPress(e){ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; }
pill.addEventListener('mousedown',beginPress);
handle.addEventListener('mousedown',beginPress);
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true;
    clearTimeout(hideTimer); clearTimeout(dwellTimer); dwellTimer=null; clearTimeout(pendingShrink);
    hideCard();
    // Straight to closed, without closeNotch's delayed shrink — Rust sizes the window for the ball
    state='idle'; root.dataset.state='idle';
    blob.style.setProperty('--tint', worstTone||'#8a8a93');
    blob.style.setProperty('--st','0');
    root.dataset.land='';
    root.dataset.drag='1';
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;root.dataset.drag='0';});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging){
    if(state!=='open') openNotch();
    else invoke('open_provider_page',{provider:press.id}).catch(()=>{});
  }
  press=null;
});
listen('drag_motion',e=>{
  if(!dragging) return;
  const {vx=0,vy=0}=e.payload||{};
  const speed=Math.hypot(vx,vy);
  blob.style.setProperty('--ang', Math.atan2(vy,vx).toFixed(3)+'rad');
  blob.style.setProperty('--st', Math.min(speed/2600,.34).toFixed(3));
  liquidDisp.setAttribute('scale', (7+Math.min(speed/160,14)).toFixed(1));
}).catch(()=>{});
listen('drag_land',e=>{
  blob.style.setProperty('--st','0');
  liquidDisp.setAttribute('scale','5');
  root.dataset.land=(e.payload&&e.payload.edge)||'free';
}).catch(()=>{});
listen('drag_end',()=>{
  // Rust emits this just before it resizes the window back to the handle, so the resize that follows
  // is measured against the handle's design width rather than the ball's
  dragging=false; press=null;
  root.dataset.drag='0';
  root.dataset.land='';
}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=String(msg||'');n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('usage',e=>{usage=e.payload||usage;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('antigravity',e=>{agSnap=e.payload||agSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
listen('commandcode',e=>{ccSnap=e.payload||ccSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_commandcode').then(u=>{ccSnap=u||ccSnap;renderRing();}).catch(()=>{});
listen('router9',e=>{r9Snap=e.payload||r9Snap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_router9').then(u=>{r9Snap=u||r9Snap;renderRing();}).catch(()=>{});
function applyCfg(){
  root.style.opacity = (cfg.opacity!=null?cfg.opacity:1);
  root.dataset.edge = cfg.edge||'right';
  root.dataset.mode = cfg.drag_enabled?'free':'dock';
  pill.dataset.cells=''; // the column/row swap changes the layout: rebuild the cells on the next render
  fitZoom(); // the mode decides the design width, so re-measure now that it is known
  renderRing();
  if(card.classList.contains('show')) renderCard();
}
listen('config',e=>{cfg=e.payload||cfg;applyCfg();}).catch(()=>{});
invoke('get_config').then(c=>{cfg=c||cfg;applyCfg();}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;renderRing();}).catch(()=>{});
</script>
</body>
</html>
